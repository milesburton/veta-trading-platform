version: 2

# This repo is Deno (backend) + Vite/Astro frontend. The frontend has a real
# package.json, so npm is the only ecosystem worth running Dependabot for.
# The other ecosystems (pip, gradle, maven, composer, bundler, pub, cargo,
# nuget) were inherited template defaults — they had no manifests to scan, but
# the nuget entry was still triggering GitHub's auto-dependency-submission
# job (`submit-nuget`) which then failed on every PR with "No .NET project
# files found in repository". Removing the unused ecosystems silences the
# noise and matches what's actually in the repo.
#
# Auto-merge for Dependabot PRs is handled by .github/workflows/trusted-automerge.yml
# which fires `gh pr merge --auto` on every non-draft PR. The `auto-merge`
# block previously present here was not a valid Dependabot option and was
# being silently ignored.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    pull-request-branch-name:
      separator: "/"
    allow:
      - dependency-type: "all"
