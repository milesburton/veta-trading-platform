name: PR Auto-Approve and Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  trusted-automerge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Wait for all REQUIRED status checks to pass before approving. The
      # approval is auto-dismissed by branch protection on every new push
      # (dismiss_stale_reviews), so a fresh run gates the approval on a fresh
      # green build. Without this, the bot approved on push — seconds after the
      # commit, long before CI finished — so the approval did not mean "green".
      - name: Wait for required checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Required checks may not be registered the instant this job starts.
          # Poll briefly for at least one required check to appear before
          # watching, so we don't race ahead and see "no checks" as success.
          for i in $(seq 1 30); do
            if gh pr checks "$PR_URL" --required >/dev/null 2>&1; then
              break
            fi
            echo "Required checks not registered yet (attempt $i)…"
            sleep 10
          done
          # --watch blocks until every required check reaches a terminal
          # state, and its own exit code already reflects the final result
          # (0 only if every required check is green). --fail-fast used to
          # be set here too, but it exits the instant ANY check is seen in a
          # transient "fail" state — including one still mid-retry on CI's
          # own internal flake-recovery logic (Integration tests retries up
          # to 3x). That meant a check which later went green on its own
          # retry still killed this job permanently, with nothing to
          # re-trigger it short of a new push, forcing a manual approval/
          # merge every time. Without --fail-fast, the watch keeps polling
          # until the real final state is known; the 45min job timeout above
          # is still the outer bound if a check genuinely never resolves.
          gh pr checks "$PR_URL" --required --watch --interval 15

      - name: Auto approve trusted PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # BOT_PAT scopes and rotation are documented in
      # docs/development/ci-cd.md "Bot PAT for auto-merge".
      - name: Enable auto-merge once checks pass
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch || \
          gh pr merge "$PR_URL" --auto --merge --delete-branch
