name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@6a033122543ee100d01838245fe74a26a038da6d
        with:
          version: "1.2.0"
          node-version: "24"
          cache: true
          cache-dependency-path: docs/site/package-lock.json
          run-install: |
          - cwd: docs/site
            args: ['--frozen-lockfile']

      - name: Copy screenshots into Astro public
        run: |
          mkdir -p docs/site/public/screenshots
          cp -r docs/screenshots/. docs/site/public/screenshots/

      - name: Build Astro site
        working-directory: docs/site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

      - id: deployment
        uses: actions/deploy-pages@v4
