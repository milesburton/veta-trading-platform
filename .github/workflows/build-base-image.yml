name: Build Dev Container Base Image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile.base"
      - ".devcontainer/config.fish"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push devcontainer base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Boot BuildKit from this repo's GHCR mirror (already authenticated
          # via the GHCR login above) instead of Docker Hub, which rate-limits
          # the anonymous moby/buildkit pull under the parallel build matrix.
          # The mirror is maintained by .github/workflows/mirror-buildkit.yml.
          driver-opts: image=ghcr.io/${{ github.repository }}/buildkit:buildx-stable-1

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veta-trading-platform-base:latest
            ghcr.io/${{ github.repository_owner }}/veta-trading-platform-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
