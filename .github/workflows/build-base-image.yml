name: Build Dev Container Base Image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile.base"
      - ".devcontainer/config.fish"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push devcontainer base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (with retry)
        # Authenticated Docker Hub pulls have a far higher rate limit than the
        # anonymous one that was timing out / throttling the moby/buildkit pull
        # during buildx boot. Skipped automatically if the secret is absent.
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            echo "docker hub login attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "docker hub login failed after 3 attempts" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veta-trading-platform-base:latest
            ghcr.io/${{ github.repository_owner }}/veta-trading-platform-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
