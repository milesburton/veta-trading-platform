name: Build Dev Container Base Image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile.base"
      - ".devcontainer/config.fish"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and push devcontainer base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Pin the BuildKit image to the AWS ECR Public mirror. Docker Hub
          # (registry-1.docker.io) rate-limits the moby/buildkit pull on CI
          # runners, which intermittently fails buildx boot.
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veta-trading-platform-base:latest
            ghcr.io/${{ github.repository_owner }}/veta-trading-platform-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
