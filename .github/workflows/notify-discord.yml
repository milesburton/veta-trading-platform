name: Notify Discord

on:
  workflow_run:
    workflows: ["CI", "Deploy GitHub Pages"]
    types: [completed]
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  ci-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post CI failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping"
            exit 0
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          CONTENT="🚨 **${WORKFLOW}** failed on main · \`${SHORT_SHA}\` by ${ACTOR}\n<${URL}>"
          PAYLOAD=$(jq -nc --arg c "$CONTENT" '{username:"VETA CI",content:$c,allowed_mentions:{parse:[]}}')
          curl --fail-with-body --show-error --silent --retry 2 \
            -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

  deploy-success:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Deploy GitHub Pages' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post pages deploy success
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping"
            exit 0
          fi
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          CONTENT="📘 Docs deployed · \`${SHORT_SHA}\` · <https://milesburton.github.io/veta-trading-platform/> · run <${RUN_URL}>"
          PAYLOAD=$(jq -nc --arg c "$CONTENT" '{username:"VETA CI",content:$c,allowed_mentions:{parse:[]}}')
          curl --fail-with-body --show-error --silent --retry 2 \
            -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

  pr-merged:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post merged PR
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret is not set; skipping"
            exit 0
          fi
          case "$AUTHOR" in
            github-actions*|release-please*|dependabot*)
              echo "skipping bot-authored merge"
              exit 0
              ;;
          esac
          CONTENT="✅ Merged **#${PR_NUMBER}** — ${PR_TITLE} (by ${AUTHOR})\n<${PR_URL}>"
          PAYLOAD=$(jq -nc --arg c "$CONTENT" '{username:"VETA CI",content:$c,allowed_mentions:{parse:[]}}')
          curl --fail-with-body --show-error --silent --retry 2 \
            -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
