name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual escape hatch: GitHub's anti-loop policy means commits made by
  # the default GITHUB_TOKEN (e.g. squash-merges via the trusted-automerge
  # workflow) don't fire on:push. Use `gh workflow run ci.yml --ref main`
  # after a merge to re-validate. The permanent fix is to swap the
  # trusted-automerge workflow to a PAT secret so its merges trigger
  # downstream workflows automatically.
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      electron: ${{ steps.filter.outputs.electron }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'compose*.yml'
              - 'backend/**'
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'shared/**'
              - 'deno.json'
              - 'deno.lock'
              - '.github/workflows/ci.yml'
            electron:
              - 'frontend/**'
              - 'electron/**'
              - '.github/workflows/ci.yml'

  lint-and-test:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      backend-coverage: ${{ steps.backend_coverage.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.x

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install backend dependencies
        run: deno install

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Unit tests with coverage
        run: |
          deno task test:coverage 2>&1 | tee /tmp/backend-test-output.txt
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/backend-test-output.txt | tail -1 || echo 0)
          echo "BACKEND_TESTS_PASSED=${PASSED}" >> "$GITHUB_ENV"

      - name: Extract backend line coverage
        id: backend_coverage
        run: |
          PCT=$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2} END { if (lf > 0) printf "%.1f", (lh*100/lf); else print "0.0" }' coverage.lcov)
          echo "value=${PCT}" >> "$GITHUB_OUTPUT"

      - name: Generate backend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          COUNT="${BACKEND_TESTS_PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"backend tests\",\"message\":\"${COUNT} passed\",\"color\":\"brightgreen\"}" > docs/badges/backend-tests.json

      - name: Commit backend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/backend-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update backend test badge [skip ci]"
            git stash --include-untracked --quiet || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git stash pop --quiet 2>/dev/null || true; exit 0; }
            git stash pop --quiet 2>/dev/null || true
            git push || true
          fi

      - name: Upload backend coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.lcov
          retention-days: 14

  frontend:
    name: Frontend lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      frontend-coverage: ${{ steps.frontend_coverage.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Biome lint
        working-directory: frontend
        run: npx @biomejs/biome check src/

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest unit tests with coverage
        working-directory: frontend
        run: |
          npm run test:coverage 2>&1 | tee /tmp/frontend-test-output.txt
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/frontend-test-output.txt | tail -1 || echo 0)
          echo "FRONTEND_TESTS_PASSED=${PASSED}" >> "$GITHUB_ENV"

      - name: Generate frontend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          COUNT="${FRONTEND_TESTS_PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"frontend tests\",\"message\":\"${COUNT} passed\",\"color\":\"brightgreen\"}" > docs/badges/frontend-tests.json

      - name: Upload frontend coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Extract frontend line coverage
        id: frontend_coverage
        run: |
          if [ -f frontend/coverage/coverage-summary.json ]; then
            PCT=$(python3 -c "import json; d=json.load(open('frontend/coverage/coverage-summary.json', encoding='utf-8')); print(f\"{d.get('total',{}).get('lines',{}).get('pct',0):.1f}\")")
            echo "value=${PCT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce frontend coverage threshold (>=80%)
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open('frontend/coverage/coverage-summary.json', encoding='utf-8') as f:
            summary = json.load(f)

          total = summary.get('total', {})
          threshold = 80.0
          metrics = {
            'lines': float(total.get('lines', {}).get('pct', 0.0) or 0.0),
            'functions': float(total.get('functions', {}).get('pct', 0.0) or 0.0),
            'branches': float(total.get('branches', {}).get('pct', 0.0) or 0.0),
            'statements': float(total.get('statements', {}).get('pct', 0.0) or 0.0),
          }

          print('Frontend coverage summary: ' + ', '.join(f"{k}={v:.1f}%" for k, v in metrics.items()))
          failed = [f"{k}={v:.1f}%" for k, v in metrics.items() if v < threshold]
          if failed:
            print(
              f"Coverage gate failed: minimum {threshold:.1f}% required for lines/functions/branches/statements. "
              f"Below threshold: {', '.join(failed)}",
              file=sys.stderr,
            )
            sys.exit(1)

          print(f"Coverage gate passed: all metrics are >= {threshold:.1f}%")
          PY

      - name: Commit frontend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/frontend-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update frontend test badge [skip ci]"
            for i in 1 2 3; do
              git stash --include-untracked --quiet || true
              if git pull --rebase origin main; then
                git stash pop --quiet 2>/dev/null || true
                if git push; then
                  echo "Pushed frontend test badge on attempt $i"
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
                git stash pop --quiet 2>/dev/null || true
              fi
              echo "Frontend test badge push attempt $i failed, retrying..."
              sleep 2
            done
            echo "⚠️ Failed to publish frontend test badge after 3 attempts (likely branch protection) — treating as non-fatal"
            exit 0
          fi

  coverage-badges:
    name: Publish coverage badges
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}


      - name: Generate frontend/backend/combined coverage badges
        env:
          BACKEND_COVERAGE: ${{ needs.lint-and-test.outputs.backend-coverage }}
          FRONTEND_COVERAGE: ${{ needs.frontend.outputs.frontend-coverage }}
        run: |
          mkdir -p docs/badges
          BACKEND="${BACKEND_COVERAGE:-0.0}"
          FRONTEND="${FRONTEND_COVERAGE:-0.0}"
          COMBINED=$(awk -v b="$BACKEND" -v f="$FRONTEND" 'BEGIN { printf "%.1f", (b + f) / 2 }')

          color_for() {
          awk -v v="$1" 'BEGIN { if (v > 80) print "brightgreen"; else if (v > 60) print "yellow"; else print "red" }'
          }

          BACKEND_COLOR=$(color_for "$BACKEND")
          FRONTEND_COLOR=$(color_for "$FRONTEND")
          COMBINED_COLOR=$(color_for "$COMBINED")

          printf '{"schemaVersion":1,"label":"backend coverage","message":"%s%%","color":"%s"}\n' "$BACKEND" "$BACKEND_COLOR" > docs/badges/backend-coverage.json
          printf '{"schemaVersion":1,"label":"frontend coverage","message":"%s%%","color":"%s"}\n' "$FRONTEND" "$FRONTEND_COLOR" > docs/badges/frontend-coverage.json
          printf '{"schemaVersion":1,"label":"combined coverage","message":"%s%%","color":"%s"}\n' "$COMBINED" "$COMBINED_COLOR" > docs/badges/combined-coverage.json
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$FRONTEND" "$FRONTEND_COLOR" > docs/badges/coverage.json

      - name: Commit coverage badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/backend-coverage.json docs/badges/frontend-coverage.json docs/badges/combined-coverage.json docs/badges/coverage.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update coverage badges [skip ci]"
            for i in 1 2 3; do
              git stash --include-untracked --quiet || true
              if git pull --rebase origin main; then
                git stash pop --quiet 2>/dev/null || true
                if git push; then
                  echo "Pushed coverage badges on attempt $i"
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
                git stash pop --quiet 2>/dev/null || true
              fi
              echo "Coverage badge push attempt $i failed, retrying..."
              sleep 2
            done
            echo "⚠️ Failed to publish coverage badges after 3 attempts (likely branch protection) — treating as non-fatal"
            exit 0
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.x

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install backend dependencies
        run: deno install

      - name: Testcontainers integration suite
        run: deno task test:testcontainers 2>&1 | tee /tmp/tc-test-output.txt
        env:
          DATABASE_URL: postgres://veta:veta@localhost:5432/veta

      - name: Generate integration test badge
        if: github.ref == 'refs/heads/main'
        run: |
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/tc-test-output.txt | awk '{s+=$1} END {print s}')
          PASSED="${PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"integration tests\",\"message\":\"${PASSED} passed\",\"color\":\"brightgreen\"}" > docs/badges/integration-tests.json

      - name: Commit integration test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/integration-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update integration test badge [skip ci]"
            git stash --include-untracked --quiet || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git stash pop --quiet 2>/dev/null || true; exit 0; }
            git stash pop --quiet 2>/dev/null || true
            git push || true
          fi

  playwright-ui:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    needs: [frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-playwright-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI tests (headless)
        working-directory: frontend
        run: |
          npx playwright test --reporter=list 2>&1 | tee /tmp/e2e-test-output.txt
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/e2e-test-output.txt | tail -1 || echo 0)
          echo "E2E_TESTS_PASSED=${PASSED}" >> "$GITHUB_ENV"
        env:
          CI: true

      - name: Generate E2E test badge
        if: github.ref == 'refs/heads/main'
        run: |
          COUNT="${E2E_TESTS_PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"e2e tests\",\"message\":\"${COUNT} passed\",\"color\":\"brightgreen\"}" > docs/badges/e2e-tests.json

      - name: Commit E2E test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/e2e-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update e2e test badge [skip ci]"
            git stash --include-untracked --quiet || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git stash pop --quiet 2>/dev/null || true; exit 0; }
            git stash pop --quiet 2>/dev/null || true
            git push || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  screenshots:
    name: Capture UI screenshots
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-playwright-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: frontend
        run: npx playwright test tests/screenshots.spec.ts --reporter=list
        env:
          CI: true

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if git diff --staged --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "chore(screenshots): update UI screenshots [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 2
            done
          fi

  panel-walkthrough:
    name: Capture panel walkthrough screenshots
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-playwright-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture panel walkthrough
        working-directory: frontend
        run: npx playwright test tests/panel-walkthrough.spec.ts --reporter=list
        env:
          CI: true

      - name: Commit updated panel walkthrough artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/panel-walkthrough/
          if git diff --staged --quiet; then
            echo "No panel walkthrough changes"
          else
            git commit -m "chore(panel-walkthrough): update panel screenshots [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 2
            done
          fi

  pr-screenshots:
    name: PR screenshot diff
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-playwright-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: frontend
        run: npx playwright test tests/screenshots.spec.ts --reporter=list
        env:
          CI: true

      - name: Compute screenshot diff
        id: diff
        run: |
          changed=$(git diff --name-only -- docs/screenshots/ | sort)
          if [ -z "$changed" ]; then
            {
              echo 'count=0'
              echo 'list<<EOF'
              echo 'EOF'
            } >>"$GITHUB_OUTPUT"
          else
            count=$(echo "$changed" | wc -l)
            {
              echo "count=$count"
              echo 'list<<EOF'
              echo "$changed"
              echo 'EOF'
            } >>"$GITHUB_OUTPUT"
          fi

      - name: Build comment body
        id: body
        env:
          COUNT: ${{ steps.diff.outputs.count }}
          LIST: ${{ steps.diff.outputs.list }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo 'body<<EOF'
            echo '<!-- pr-screenshots-bot -->'
            echo '## 📸 UI screenshots'
            echo ''
            if [ "$COUNT" = '0' ]; then
              echo '_No UI changes in this PR._'
            else
              echo "**$COUNT screenshot(s) changed vs \`main\`:**"
              echo ''
              while IFS= read -r f; do
                [ -n "$f" ] && echo "- \`${f#docs/screenshots/}\`"
              done <<<"$LIST"
              echo ''
              echo "[Download artifact for visual review →]($RUN_URL#artifacts)"
            fi
            echo ''
            echo "<sub>Generated from screenshots.spec.ts · run [\`${GITHUB_RUN_ID}\`]($RUN_URL)</sub>"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Upload changed screenshots
        if: steps.diff.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots-${{ github.event.pull_request.number }}
          path: docs/screenshots/
          retention-days: 14

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- pr-screenshots-bot -->'

      - name: Upsert PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.body.outputs.body }}
          edit-mode: replace

  pr-visual-anomalies:
    name: PR visual anomalies
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-playwright-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run visual anomaly checks
        working-directory: frontend
        run: npx playwright test tests/visual-anomalies.spec.ts --reporter=list
        env:
          CI: true

      - name: Build comment body
        id: body
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPORT=docs/visual-anomalies/report.json
          {
            echo 'body<<EOF'
            echo '<!-- pr-visual-anomalies-bot -->'
            echo '## 🔍 Visual anomaly check'
            echo ''
            if [ ! -f "$REPORT" ]; then
              echo '_No report produced — the spec may have failed before writing._'
            else
              total_overflows=$(jq '[.reports[].overflows | length] | add // 0' "$REPORT")
              total_axe=$(jq '[.reports[].axe[].nodeCount] | add // 0' "$REPORT")
              if [ "$total_overflows" = "0" ] && [ "$total_axe" = "0" ]; then
                echo '_Clean — no overflows and no axe-core violations across the checked scenarios._'
              else
                echo "**Found $total_overflows overflow(s) and $total_axe axe violation node(s) across $(jq '.scenarios | length' "$REPORT") scenarios.**"
                echo ''
                echo '| Scenario | Overflows | Axe rules (impact / nodes) |'
                echo '| --- | --- | --- |'
                jq -r '.reports[] | "| \(.scenario) | \(.overflows | length) | \(if (.axe | length) == 0 then "—" else (.axe | map("\(.id) (\(.impact // "none")/\(.nodeCount))") | join(", ")) end) |"' "$REPORT"
                echo ''
                echo "[Download full report →]($RUN_URL#artifacts)"
              fi
            fi
            echo ''
            echo "<sub>Generated from visual-anomalies.spec.ts · run [\`${GITHUB_RUN_ID}\`]($RUN_URL)</sub>"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-visual-anomalies-${{ github.event.pull_request.number }}
          path: docs/visual-anomalies/
          retention-days: 14

      - name: Find existing comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- pr-visual-anomalies-bot -->'

      - name: Upsert PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.body.outputs.body }}
          edit-mode: replace

  electron:
    name: Electron build & E2E tests
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install xvfb and Electron native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth libgbm-dev

      - name: Install Playwright for Electron tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Electron app
        working-directory: frontend
        run: npm run electron:build
        env:
          ELECTRON_BUILD: "1"

      - name: Run Electron E2E tests (headless via xvfb)
        id: electron-e2e
        continue-on-error: true
        working-directory: frontend
        run: xvfb-run --auto-servernum npm run test:electron
        env:
          CI: true

      - name: Build Electron app (test variant — mocks baked in)
        if: always()
        working-directory: frontend
        run: npm run electron:build-test

      - name: Capture Electron screenshots (headless via xvfb)
        if: always()
        working-directory: frontend
        run: xvfb-run --auto-servernum npx playwright test --config=playwright.electron.config.ts tests-electron/screenshots.spec.ts --reporter=list
        env:
          CI: true

      - name: Commit updated Electron screenshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/electron-*.png
          if git diff --staged --quiet; then
            echo "No Electron screenshot changes"
            exit 0
          fi
          git commit -m "chore(screenshots): update Electron desktop screenshots [skip ci]"
          for i in 1 2 3; do
            # Stash any unstaged build artefacts so rebase can proceed cleanly
            git stash --include-untracked --quiet || true
            if git pull --rebase origin main; then
              git stash pop --quiet 2>/dev/null || true
              if git push; then
                echo "✅ Pushed Electron screenshots on attempt $i"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
              git stash pop --quiet 2>/dev/null || true
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "⚠️ Failed to push Electron screenshots after 3 attempts (likely branch protection) — treating as non-fatal"
          exit 0

      - name: Upload Electron test report on failure
        if: always() && (steps.electron-e2e.outcome == 'failure' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Report Electron E2E result
        if: always()
        run: |
          if [ "${{ steps.electron-e2e.outcome }}" = "failure" ]; then
            echo "::warning::Electron E2E tests failed (non-blocking) — screenshot capture and commit still ran"
          else
            echo "✅ Electron E2E tests passed"
          fi

  docker-base:
    name: Build base image
    runs-on: ubuntu-latest
    needs: [changes, lint-and-test, frontend]
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      base-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/milesburton/veta-trading-platform/base
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [docker-base]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            file: docker/frontend/Dockerfile
          - service: market-sim
            file: docker/market-sim/Dockerfile
          - service: ems
            file: docker/ems/Dockerfile
          - service: oms
            file: docker/oms/Dockerfile
          - service: limit-algo
            file: docker/limit-algo/Dockerfile
          - service: twap-algo
            file: docker/twap-algo/Dockerfile
          - service: pov-algo
            file: docker/pov-algo/Dockerfile
          - service: vwap-algo
            file: docker/vwap-algo/Dockerfile
          - service: iceberg-algo
            file: docker/iceberg-algo/Dockerfile
          - service: sniper-algo
            file: docker/sniper-algo/Dockerfile
          - service: arrival-price-algo
            file: docker/arrival-price-algo/Dockerfile
          - service: momentum-algo
            file: docker/momentum-algo/Dockerfile
          - service: is-algo
            file: docker/is-algo/Dockerfile
          - service: observability
            file: docker/observability/Dockerfile
          - service: user-service
            file: docker/user-service/Dockerfile
          - service: journal
            file: docker/journal/Dockerfile
          - service: fix-exchange
            file: docker/fix-exchange/Dockerfile
          - service: fix-gateway
            file: docker/fix-gateway/Dockerfile
          - service: fix-archive
            file: docker/fix-archive/Dockerfile
          - service: analytics
            file: docker/analytics/Dockerfile
          - service: market-data
            file: docker/market-data/Dockerfile
          - service: market-data-adapters
            file: docker/market-data-adapters/Dockerfile
          - service: feature-engine
            file: docker/feature-engine/Dockerfile
          - service: signal-engine
            file: docker/signal-engine/Dockerfile
          - service: recommendation-engine
            file: docker/recommendation-engine/Dockerfile
          - service: scenario-engine
            file: docker/scenario-engine/Dockerfile
          - service: llm-advisory
            file: docker/llm-advisory/Dockerfile
          - service: llm-worker
            file: docker/llm-worker/Dockerfile
          - service: news-aggregator
            file: docker/news-aggregator/Dockerfile
          - service: gateway
            file: docker/gateway/Dockerfile
          - service: dark-pool
            file: docker/dark-pool/Dockerfile
          - service: ccp-service
            file: docker/ccp-service/Dockerfile
          - service: rfq-service
            file: docker/rfq-service/Dockerfile
          - service: product-service
            file: docker/product-service/Dockerfile
          - service: replay-service
            file: docker/replay-service/Dockerfile
          - service: risk-engine
            file: docker/risk-engine/Dockerfile
          - service: db-migrate
            file: docker/db-migrate/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/milesburton/veta-trading-platform/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Read app version
        id: appver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_TAG=${{ needs.docker-base.outputs.base-tag }}
            COMMIT_SHA=${{ github.sha }}
            VITE_DEPLOYMENT=uat
            VITE_COMMIT_SHA=${{ github.sha }}
            VITE_BUILD_DATE=${{ github.run_started_at }}
            VITE_APP_VERSION=${{ steps.appver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
