name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  # Manual escape hatch: GitHub's anti-loop policy means commits made by
  # the default GITHUB_TOKEN (e.g. squash-merges via the trusted-automerge
  # workflow) don't fire on:push. Use `gh workflow run ci.yml --ref main`
  # after a merge to re-validate. The permanent fix is to swap the
  # trusted-automerge workflow to a PAT secret so its merges trigger
  # downstream workflows automatically.
  workflow_dispatch:

jobs:
  github-health:
    name: GitHub status (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for unresolved GitHub incidents
        run: |
          set -euo pipefail
          incidents=$(curl -fsSL --max-time 15 \
            https://www.githubstatus.com/api/v2/incidents/unresolved.json \
            || echo '{"incidents":[]}')

          count=$(echo "$incidents" | jq '.incidents | length')

          if [[ "$count" -eq 0 ]]; then
            echo "GitHub reports no unresolved incidents."
            exit 0
          fi

          echo "$incidents" | jq -r '
            .incidents[] |
            "::warning title=GitHub incident affecting CI may be in progress::\(.name) [\(.impact)] — \(.shortlink)"
          '

          echo ""
          echo "GitHub has $count unresolved incident(s). If CI failures look like auth/registry/checkout flakes (denied: denied, Bad credentials, could not read Username), they are likely upstream. Rerun the failed jobs before changing code. See docs/development/ci-cd#troubleshooting-ci-failures."
          # Never block CI on this check.
          exit 0

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ fromJSON(steps.filter.outputs.outputs).docker }}
      docs: ${{ fromJSON(steps.filter.outputs.outputs).docs }}
      electron: ${{ fromJSON(steps.filter.outputs.outputs).electron }}
      fallow: ${{ fromJSON(steps.filter.outputs.outputs).fallow }}
      prometheus_rules: ${{ fromJSON(steps.filter.outputs.outputs).prometheus_rules }}
    steps:
      - uses: actions/checkout@v5

      - uses: Wandalen/wretry.action@v3.8.0
        id: filter
        with:
          action: dorny/paths-filter@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            filters: |
              docker:
                - 'docker/**'
                - 'compose*.yml'
                - 'backend/**'
                - 'frontend/src/**'
                - 'frontend/public/**'
                - 'frontend/package.json'
                - 'frontend/package-lock.json'
                - 'shared/**'
                - 'deno.json'
                - 'deno.lock'
                - '.github/workflows/ci.yml'
              electron:
                - 'frontend/**'
                - 'electron/**'
                - '.github/workflows/ci.yml'
              fallow:
                - 'backend/**'
                - 'frontend/**'
                - 'shared/**'
                - '.github/workflows/ci.yml'
              prometheus_rules:
                - 'observability/prometheus-rules.yml'
                - 'observability/prometheus-rules.test.yml'
                - '.github/workflows/ci.yml'
              docs:
                - 'docs/**'
                - '.github/workflows/ci.yml'

  lint-and-test:
    name: Lint, type-check, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      backend-coverage: ${{ steps.backend_coverage.outputs.value }}
    steps:
      # PR runs use the default token (no push needed); push runs use the bot
      # token so badge commits fire downstream workflows. See ci-cd docs.
      - uses: actions/checkout@v5
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.BOT_PAT }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.x

      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install backend dependencies
        run: deno install

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Unit tests with coverage
        run: |
          deno task test:coverage 2>&1 | tee /tmp/backend-test-output.txt
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/backend-test-output.txt | tail -1 || echo 0)
          echo "BACKEND_TESTS_PASSED=${PASSED}" >> "$GITHUB_ENV"

      - name: Extract backend line coverage
        id: backend_coverage
        run: |
          PCT=$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2} END { if (lf > 0) printf "%.1f", (lh*100/lf); else print "0.0" }' coverage.lcov)
          echo "value=${PCT}" >> "$GITHUB_OUTPUT"

      - name: Generate backend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          COUNT="${BACKEND_TESTS_PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"backend tests\",\"message\":\"${COUNT} passed\",\"color\":\"brightgreen\"}" > docs/badges/backend-tests.json

      - name: Commit backend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/backend-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update backend test badge [skip ci]"
            git stash --include-untracked --quiet || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git stash pop --quiet 2>/dev/null || true; exit 0; }
            git stash pop --quiet 2>/dev/null || true
            git push || true
          fi

      - name: Upload backend coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: coverage.lcov
          retention-days: 14

  frontend:
    name: Frontend lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      frontend-coverage: ${{ steps.frontend_coverage.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Biome lint
        working-directory: frontend
        run: npx @biomejs/biome check src/

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Check for leaked private IPs in public docs
        run: |
          # The Astro/Starlight site under docs/site/src/ is built and
          # published to GitHub Pages. Anything in there is internet-public.
          # Reject RFC1918 (10/8, 172.16/12, 192.168/16) addresses appearing
          # in source files, which would advertise internal infrastructure
          # to the world. Loopback (127/8) is excluded because it is a
          # generic "this machine" address and leaks no infra information,
          # so command syntax like `ssh -R 18443:127.0.0.1:443` is allowed.
          if grep -rnE '\b(10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+)\b' \
              docs/site/src/ \
              --include='*.md' --include='*.mdx' --include='*.html' --include='*.tsx' --include='*.ts'; then
            echo "::error::Private IP address(es) leaked into public docs (docs/site/src/). Remove or describe abstractly."
            exit 1
          fi
          echo "No private IPs in public docs."

      - name: Vitest unit tests with coverage
        working-directory: frontend
        run: |
          npm run test:coverage 2>&1 | tee /tmp/frontend-test-output.txt
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/frontend-test-output.txt | tail -1 || echo 0)
          echo "FRONTEND_TESTS_PASSED=${PASSED}" >> "$GITHUB_ENV"

      - name: Generate frontend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          COUNT="${FRONTEND_TESTS_PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"frontend tests\",\"message\":\"${COUNT} passed\",\"color\":\"brightgreen\"}" > docs/badges/frontend-tests.json

      - name: Upload frontend coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: Extract frontend line coverage
        id: frontend_coverage
        run: |
          if [ -f frontend/coverage/coverage-summary.json ]; then
            PCT=$(python3 -c "import json; d=json.load(open('frontend/coverage/coverage-summary.json', encoding='utf-8')); print(f\"{d.get('total',{}).get('lines',{}).get('pct',0):.1f}\")")
            echo "value=${PCT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce frontend coverage threshold (>=80%)
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open('frontend/coverage/coverage-summary.json', encoding='utf-8') as f:
            summary = json.load(f)

          total = summary.get('total', {})
          threshold = 80.0
          metrics = {
            'lines': float(total.get('lines', {}).get('pct', 0.0) or 0.0),
            'functions': float(total.get('functions', {}).get('pct', 0.0) or 0.0),
            'branches': float(total.get('branches', {}).get('pct', 0.0) or 0.0),
            'statements': float(total.get('statements', {}).get('pct', 0.0) or 0.0),
          }

          print('Frontend coverage summary: ' + ', '.join(f"{k}={v:.1f}%" for k, v in metrics.items()))
          failed = [f"{k}={v:.1f}%" for k, v in metrics.items() if v < threshold]
          if failed:
            print(
              f"Coverage gate failed: minimum {threshold:.1f}% required for lines/functions/branches/statements. "
              f"Below threshold: {', '.join(failed)}",
              file=sys.stderr,
            )
            sys.exit(1)

          print(f"Coverage gate passed: all metrics are >= {threshold:.1f}%")
          PY

      - name: Commit frontend test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/frontend-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update frontend test badge [skip ci]"
            for i in 1 2 3; do
              git stash --include-untracked --quiet || true
              if git pull --rebase origin main; then
                git stash pop --quiet 2>/dev/null || true
                if git push; then
                  echo "Pushed frontend test badge on attempt $i"
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
                git stash pop --quiet 2>/dev/null || true
              fi
              echo "Frontend test badge push attempt $i failed, retrying..."
              sleep 2
            done
            echo "⚠️ Failed to publish frontend test badge after 3 attempts (likely branch protection) — treating as non-fatal"
            exit 0
          fi

  fallow:
    name: Fallow audit (PR diff)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.fallow == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-frontend-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Ensure base ref is available
        run: git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"

      - name: "Fallow audit (backend)"
        id: backend_audit
        working-directory: backend
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set +e
          ../frontend/node_modules/.bin/fallow audit \
            --changed-since "$BASE_REF" \
            --format sarif \
            --fail-on-issues \
            --quiet > ../fallow-backend-audit.sarif 2>/dev/null
          status=$?
          if [ -s ../fallow-backend-audit.sarif ]; then
            count=$(jq '.runs[0].results | length' ../fallow-backend-audit.sarif 2>/dev/null || echo "?")
            echo "Backend introduced findings: $count"
            jq -r '.runs[0].results | group_by(.ruleId) | map("  \(.[0].ruleId): \(length)") | .[]' ../fallow-backend-audit.sarif 2>/dev/null || true
          fi
          exit $status

      - name: "Fallow audit (frontend)"
        id: frontend_audit
        working-directory: frontend
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          set +e
          ./node_modules/.bin/fallow audit \
            --changed-since "$BASE_REF" \
            --format sarif \
            --fail-on-issues \
            --quiet > ../fallow-frontend-audit.sarif 2>/dev/null
          status=$?
          if [ -s ../fallow-frontend-audit.sarif ]; then
            count=$(jq '.runs[0].results | length' ../fallow-frontend-audit.sarif 2>/dev/null || echo "?")
            echo "Frontend introduced findings: $count"
            jq -r '.runs[0].results | group_by(.ruleId) | map("  \(.[0].ruleId): \(length)") | .[]' ../fallow-frontend-audit.sarif 2>/dev/null || true
          fi
          exit $status

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fallow-audit-sarif
          path: |
            fallow-backend-audit.sarif
            fallow-frontend-audit.sarif
          retention-days: 14

  prometheus-rules:
    name: Prometheus alert rules
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.prometheus_rules == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install promtool
        run: |
          set -e
          PROM_VERSION=3.1.0
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          promtool --version

      - name: Check rule syntax
        run: promtool check rules observability/prometheus-rules.yml

      - name: Run unit tests
        run: promtool test rules observability/prometheus-rules.test.yml

  docs-build:
    name: Docs build & lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: |
            docs/site/node_modules
            ~/.npm
          key: npm-${{ runner.os }}-docs-${{ hashFiles('docs/site/package-lock.json', 'docs/site/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-docs-

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "docs/**/*.mdx" "!docs/site/node_modules/**" "!docs/site/dist/**"

      - name: Validate mermaid blocks
        working-directory: docs/site
        run: npm run validate:mermaid

      - name: Copy screenshots into Astro public
        run: |
          mkdir -p docs/site/public/screenshots/panels
          cp -r docs/screenshots/. docs/site/public/screenshots/
          cp -r docs/panel-walkthrough/screenshots/. docs/site/public/screenshots/panels/

      - name: Build Astro site
        working-directory: docs/site
        run: npm run build

      - name: Validate internal links
        working-directory: docs/site
        run: npm run validate:links

  coverage-badges:
    name: Publish coverage badges
    runs-on: ubuntu-latest
    needs: [lint-and-test, frontend, integration]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.BOT_PAT }}

      - name: Download unit coverage
        uses: actions/download-artifact@v6
        with:
          name: backend-coverage
          path: cov-unit
        continue-on-error: true

      - name: Download TC coverage
        uses: actions/download-artifact@v6
        with:
          name: backend-tc-coverage
          path: cov-tc
        continue-on-error: true

      - name: Combine backend coverage (unit + TC)
        id: combine
        run: |
          inputs=()
          [[ -f cov-unit/coverage.lcov ]] && inputs+=(cov-unit/coverage.lcov)
          [[ -f cov-tc/coverage-tc.lcov ]] && inputs+=(cov-tc/coverage-tc.lcov)
          if [[ ${#inputs[@]} -eq 0 ]]; then
            : > coverage-combined.lcov
          else
            python3 scripts/merge-lcov.py "${inputs[@]}" > coverage-combined.lcov
          fi
          PCT=$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2} END { if (lf > 0) printf "%.1f", (lh*100/lf); else print "0.0" }' coverage-combined.lcov)
          echo "backend=${PCT}" >> "$GITHUB_OUTPUT"

      - name: Generate frontend/backend/combined coverage badges
        env:
          BACKEND_COVERAGE: ${{ steps.combine.outputs.backend }}
          FRONTEND_COVERAGE: ${{ needs.frontend.outputs.frontend-coverage }}
        run: |
          mkdir -p docs/badges
          BACKEND="${BACKEND_COVERAGE:-0.0}"
          FRONTEND="${FRONTEND_COVERAGE:-0.0}"
          COMBINED=$(awk -v b="$BACKEND" -v f="$FRONTEND" 'BEGIN { printf "%.1f", (b + f) / 2 }')

          color_for() {
          awk -v v="$1" 'BEGIN { if (v > 80) print "brightgreen"; else if (v > 60) print "yellow"; else print "red" }'
          }

          BACKEND_COLOR=$(color_for "$BACKEND")
          FRONTEND_COLOR=$(color_for "$FRONTEND")
          COMBINED_COLOR=$(color_for "$COMBINED")

          printf '{"schemaVersion":1,"label":"backend coverage","message":"%s%%","color":"%s"}\n' "$BACKEND" "$BACKEND_COLOR" > docs/badges/backend-coverage.json
          printf '{"schemaVersion":1,"label":"frontend coverage","message":"%s%%","color":"%s"}\n' "$FRONTEND" "$FRONTEND_COLOR" > docs/badges/frontend-coverage.json
          printf '{"schemaVersion":1,"label":"combined coverage","message":"%s%%","color":"%s"}\n' "$COMBINED" "$COMBINED_COLOR" > docs/badges/combined-coverage.json
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$FRONTEND" "$FRONTEND_COLOR" > docs/badges/coverage.json

      - name: Commit coverage badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/backend-coverage.json docs/badges/frontend-coverage.json docs/badges/combined-coverage.json docs/badges/coverage.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update coverage badges [skip ci]"
            for i in 1 2 3; do
              git stash --include-untracked --quiet || true
              if git pull --rebase origin main; then
                git stash pop --quiet 2>/dev/null || true
                if git push; then
                  echo "Pushed coverage badges on attempt $i"
                  exit 0
                fi
              else
                git rebase --abort 2>/dev/null || true
                git stash pop --quiet 2>/dev/null || true
              fi
              echo "Coverage badge push attempt $i failed, retrying..."
              sleep 2
            done
            echo "⚠️ Failed to publish coverage badges after 3 attempts (likely branch protection) — treating as non-fatal"
            exit 0
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.BOT_PAT }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.x

      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install backend dependencies
        run: deno install

      - name: Testcontainers integration suite (with coverage)
        run: deno task test:testcontainers:coverage 2>&1 | tee /tmp/tc-test-output.txt
        env:
          DATABASE_URL: postgres://veta:veta@localhost:5432/veta

      - name: Generate TC coverage lcov
        run: deno coverage coverage --lcov > coverage-tc.lcov || echo "(no TC coverage produced)"

      - name: Upload TC coverage
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: backend-tc-coverage
          path: coverage-tc.lcov
          retention-days: 14

      - name: Generate integration test badge
        if: github.ref == 'refs/heads/main'
        run: |
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/tc-test-output.txt | awk '{s+=$1} END {print s}')
          PASSED="${PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"integration tests\",\"message\":\"${PASSED} passed\",\"color\":\"brightgreen\"}" > docs/badges/integration-tests.json

      - name: Commit integration test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/integration-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update integration test badge [skip ci]"
            git stash --include-untracked --quiet || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git stash pop --quiet 2>/dev/null || true; exit 0; }
            git stash pop --quiet 2>/dev/null || true
            git push || true
          fi

  playwright-ui:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    needs: [frontend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || secrets.BOT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache npm and Playwright browsers
        uses: actions/cache@v5
        with:
          path: |
            frontend/node_modules
            ~/.npm
            ~/.cache/ms-playwright
          key: npm-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            npm-playwright-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI tests (headless)
        working-directory: frontend
        run: |
          npx playwright test --reporter=list 2>&1 | tee /tmp/e2e-test-output.txt
          PASSED=$(grep -oP '\d+(?= passed)' /tmp/e2e-test-output.txt | tail -1 || echo 0)
          echo "E2E_TESTS_PASSED=${PASSED}" >> "$GITHUB_ENV"
        env:
          CI: true

      - name: Generate E2E test badge
        if: github.ref == 'refs/heads/main'
        run: |
          COUNT="${E2E_TESTS_PASSED:-0}"
          echo "{\"schemaVersion\":1,\"label\":\"e2e tests\",\"message\":\"${COUNT} passed\",\"color\":\"brightgreen\"}" > docs/badges/e2e-tests.json

      - name: Commit E2E test badge
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/badges/e2e-tests.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): update e2e test badge [skip ci]"
            git stash --include-untracked --quiet || true
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; git stash pop --quiet 2>/dev/null || true; exit 0; }
            git stash pop --quiet 2>/dev/null || true
            git push || true
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  screenshots:
