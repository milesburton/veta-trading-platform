name: Post-deploy probe

# Runs after every push to main. Polls the gateway's /health endpoint
# until its reported commit SHA matches the merged commit (the server's
# 5-minute auto-pull timer picks up the new commit and rolls out the new
# images), then runs the synthetic probe against the public URL. Waiting
# for the SHA to go live, rather than sleeping a fixed interval, avoids
# probing a half-deployed stack when a rollout runs slow.
# Detects "your latest deploy broke prod" shortly after it is live.
#
# This is the same Deno probe that runs every 60s on the edge server.
# CI is a third, independent vantage point — if the edge probe sees a
# different result from GitHub runners, the divergence itself is a
# useful signal (e.g. an edge-side network issue).
#
# Triggered also on manual workflow_dispatch for ad-hoc checks.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Max minutes to wait for the new commit to go live before probing anyway"
        type: number
        default: 12
      base_url:
        description: "Probe target URL"
        type: string
        default: "https://veta.example.com"

permissions:
  contents: read

concurrency:
  # Only the most recent push to main needs to run this. If a new push
  # arrives while this is mid-wait, cancel the in-progress run.
  group: post-deploy-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ inputs.base_url || 'https://veta.example.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          # Only need the probe script — shallow checkout.
          fetch-depth: 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Wait for the new commit to be live
        env:
          BASE_URL: ${{ inputs.base_url || 'https://veta.example.com' }}
          # Hard cap on how long we will wait for auto-pull (5-min timer +
          # image pull + recreate). Beyond this we probe anyway so a stuck
          # deploy still surfaces as a probe failure rather than a hang.
          MAX_WAIT_MIN: ${{ inputs.wait_minutes || 12 }}
        run: |
          echo "Waiting for ${GITHUB_SHA:0:7} to be live at ${BASE_URL} (up to ${MAX_WAIT_MIN}m)..."
          deadline=$(( $(date +%s) + MAX_WAIT_MIN * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # /health reports the gateway's running commit SHA. When it
            # matches the merged SHA the new build is serving and ready.
            live=$(curl -fsS --max-time 10 "${BASE_URL}/health" 2>/dev/null \
              | grep -oE '"version":"[0-9a-f]{40}"' | cut -d'"' -f4 || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "✅ ${GITHUB_SHA:0:7} is live (gateway /health matches)."
              exit 0
            fi
            echo "  not yet: gateway reports '${live:-unreachable}', waiting 20s..."
            sleep 20
          done
          echo "::warning::${GITHUB_SHA:0:7} not confirmed live within ${MAX_WAIT_MIN}m; probing anyway."

      - name: Run synthetic probe
        env:
          PROBE_BASE_URL: ${{ inputs.base_url || 'https://veta.example.com' }}
          PROBE_TIMEOUT_MS: "15000"
        run: |
          # Retry up to 3 times — auto-pull cadence has jitter, and the
          # probe may catch a brief gateway recreate window.
          for attempt in 1 2 3; do
            echo "::group::probe attempt ${attempt}"
            if deno run --allow-net --allow-env synthetic-probe/probe.ts; then
              echo "::endgroup::"
              echo "✅ Probe passed on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              echo "⚠ Probe failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "❌ Probe failed 3 consecutive attempts against ${PROBE_BASE_URL}"
          echo "::error::Synthetic probe failed against ${PROBE_BASE_URL} after merge of ${GITHUB_SHA:0:7}"
          exit 1
