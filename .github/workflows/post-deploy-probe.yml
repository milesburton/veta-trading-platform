name: Post-deploy probe

# Runs after every push to main that changes something a Docker image is
# built from. Images are published only when CI passes on that commit, so
# it first waits for CI to finish (a CI failure or cancellation means no
# new images, and the probe is skipped), then polls the gateway's /health endpoint until its reported
# commit SHA matches the merged commit (the server's 5-minute auto-pull
# timer picks up the new commit and rolls out the new images), then runs
# the synthetic probe against the public URL. Waiting for the SHA to go
# live, rather than sleeping a fixed interval, avoids probing a
# half-deployed stack when a rollout runs slow.
# Detects "your latest deploy broke prod" shortly after it is live.
#
# A push that only touches docs/screenshots never rebuilds the gateway
# image, so the gateway can never report the pushed SHA: waiting for it
# anyway just times out on every docs-only commit. The changes job below
# mirrors ci.yml's docker-path filter so this workflow only waits for a
# SHA when a new image was actually going to be built.
#
# This is the same probe that runs every 60s on the edge server.
# CI is a third, independent vantage point: if the edge probe sees a
# different result from GitHub runners, the divergence itself is a
# useful signal (e.g. an edge-side network issue).
#
# Triggered also on manual workflow_dispatch for ad-hoc checks; dispatch
# always probes regardless of what last changed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Max minutes to wait for the new commit to go live"
        type: number
        default: 12
      base_url:
        description: "Probe target URL"
        type: string
        default: "https://veta.mnetcs.com"

permissions:
  contents: read

concurrency:
  # Only the most recent push to main needs to run this. If a new push
  # arrives while this is mid-wait, cancel the in-progress run.
  group: post-deploy-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release')"
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'compose*.yml'
              - 'backend/**'
              - 'frontend/src/**'
              - 'frontend/public/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  probe:
    name: Probe ${{ inputs.base_url || 'https://veta.mnetcs.com' }}
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true')
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Only need the probe script: shallow checkout.
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Wait for CI to publish the images
        id: ci
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_CI_WAIT_MIN: "40"
        run: |
          echo "Waiting for CI on ${GITHUB_SHA:0:7} (images are published only after CI passes)..."
          deadline=$(( $(date +%s) + MAX_CI_WAIT_MIN * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            read -r status conclusion < <(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --json status,conclusion --jq '.[0] | "\(.status // "missing") \(.conclusion // "none")"')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "deployable=true" >> "$GITHUB_OUTPUT"
              else
                echo "CI finished with '${conclusion}'; no new images were published, skipping the probe."
                echo "deployable=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "  CI is '${status}', waiting 30s..."
            sleep 30
          done
          echo "::error::CI for ${GITHUB_SHA:0:7} did not finish within ${MAX_CI_WAIT_MIN}m."
          exit 1

      - name: Wait for the new commit to be live
        if: steps.ci.outputs.deployable != 'false'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://veta.mnetcs.com' }}
          # Hard cap on how long we wait for auto-pull (5-min timer + image
          # pull + recreate). Not observing the requested SHA is itself a
          # failed deployment; availability of an older build is not success.
          MAX_WAIT_MIN: ${{ inputs.wait_minutes || 12 }}
        run: |
          echo "Waiting for ${GITHUB_SHA:0:7} to be live at ${BASE_URL} (up to ${MAX_WAIT_MIN}m)..."
          deadline=$(( $(date +%s) + MAX_WAIT_MIN * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # /health reports the gateway's running commit SHA. When it
            # matches the merged SHA the new build is serving and ready.
            live=$(curl -fsS --max-time 10 "${BASE_URL}/health" 2>/dev/null \
              | grep -oE '"version":"[0-9a-f]{40}"' | cut -d'"' -f4 || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "✅ ${GITHUB_SHA:0:7} is live (gateway /health matches)."
              exit 0
            fi
            echo "  not yet: gateway reports '${live:-unreachable}', waiting 20s..."
            sleep 20
          done
          echo "::error::${GITHUB_SHA:0:7} not confirmed live within ${MAX_WAIT_MIN}m."
          exit 1

      - name: Run synthetic probe
        if: steps.ci.outputs.deployable != 'false'
        env:
          PROBE_BASE_URL: ${{ inputs.base_url || 'https://veta.mnetcs.com' }}
          PROBE_TIMEOUT_MS: "15000"
        run: |
          # Retry up to 3 times: auto-pull cadence has jitter, and the
          # probe may catch a brief gateway recreate window.
          for attempt in 1 2 3; do
            echo "::group::probe attempt ${attempt}"
            if node synthetic-probe/probe.ts; then
              echo "::endgroup::"
              echo "✅ Probe passed on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              echo "⚠ Probe failed; retrying in 30s..."
              sleep 30
            fi
          done
          echo "❌ Probe failed 3 consecutive attempts against ${PROBE_BASE_URL}"
          echo "::error::Synthetic probe failed against ${PROBE_BASE_URL} after merge of ${GITHUB_SHA:0:7}"
          exit 1
