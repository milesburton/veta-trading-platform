name: Check clean working directory

on:
  pull_request:
    branches: ["main", "**"]

jobs:
  check-clean-state:
    name: Verify no uncommitted changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install backend dependencies
        run: deno install

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check for uncommitted changes
        run: |
          echo "Checking for uncommitted changes in working directory..."
          
          # Run a quick lint to ensure any generated files are up-to-date
          deno task lint --fix || true
          cd frontend && deno run -A npm:@biomejs/biome check --write src/ || true
          cd ..
          
          # Check if there are any uncommitted changes
          if ! git diff-index --quiet HEAD --; then
            echo "❌ ERROR: Uncommitted changes detected after running linters"
            echo "The following files have uncommitted changes:"
            git diff-index --name-only HEAD --
            echo ""
            echo "This typically means:"
            echo "  - Lock files were modified and not committed"
            echo "  - Generated files were not properly committed"
            echo "  - Lint/format rules were not applied before committing"
            echo ""
            echo "Please run 'deno task lint' and 'cd frontend && npm run lint' locally,"
            echo "commit any changes, and push again."
            exit 1
          fi
          
          echo "✅ Working directory is clean - all files are properly committed"
