name: Check clean working directory

on:
  pull_request:
    branches: ["main", "**"]

jobs:
  check-clean-state:
    name: Verify no uncommitted changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.x

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache Deno deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock', 'deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install backend dependencies
        run: deno install

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install docs/site dependencies
        working-directory: docs/site
        run: npm ci

      - name: Regenerate derived docs files
        working-directory: docs/site
        run: npm run generate

      - name: Check for uncommitted changes
        run: |
          echo "Checking for uncommitted changes in working directory..."

          # Run a quick lint to ensure any generated files are up-to-date
          deno task lint --fix || true
          cd frontend && deno run -A npm:@biomejs/biome check --write src/ || true
          cd ..

          # Check if there are any uncommitted changes
          if ! git diff-index --quiet HEAD --; then
            echo "❌ ERROR: Uncommitted changes detected after running linters and docs generators"
            echo "The following files have uncommitted changes:"
            git diff-index --name-only HEAD --
            echo ""
            echo "── DIFF (first ~200 lines per file) ──────────────────"
            # Print the diff content so we can see WHY each file
            # differs — the local pre-commit hook never produces drift,
            # so the difference must be environment-specific (Node
            # version, line endings, fs order, etc).
            git diff HEAD -- | head -300
            echo "── END DIFF ─────────────────────────────────────────"
            echo ""
            echo "This typically means one of:"
            echo "  - Lock files were modified and not committed"
            echo "  - Generated docs files are stale: a code change (services, algos,"
            echo "    RBAC roles, panels, migrations, etc) means 'npm run generate'"
            echo "    in docs/site/ produces different output than what's committed"
            echo "  - Lint/format rules were not applied before committing"
            echo ""
            echo "Fix locally with:"
            echo "  cd docs/site && npm run generate"
            echo "  deno task lint"
            echo "  cd frontend && npm run lint"
            echo "  git add -A && git commit -m 'chore(docs): regenerate'"
            echo ""
            echo "Pre-commit hook does this automatically — see .husky/pre-commit."
            exit 1
          fi

          echo "✅ Working directory is clean — all generated docs are in sync with source code"
