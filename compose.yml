      - "traefik.http.routers.gateway-ws.entrypoints=web,websecure"
      - "traefik.http.routers.gateway-ws.service=gateway"
      - "traefik.http.routers.gateway-ws.priority=20"
      - "traefik.http.routers.health.rule=Path(`/health`)"
      - "traefik.http.routers.health.entrypoints=web,websecure"
      - "traefik.http.routers.health.service=gateway"
      - "traefik.http.routers.health.priority=25"

  disk-monitor:
    image: python:3.12-alpine
    container_name: veta-disk-monitor
    restart: unless-stopped
    command: python3 /scripts/disk-monitor.py
    networks:
      - trading-net
    volumes:
      - ./scripts/disk-monitor.py:/scripts/disk-monitor.py:ro
      - /:/host:ro
    environment:
      WARN_PCT: "85"
    ports:
      - "8099:8099"
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Probe /metrics, not /health: /health returns 503 when disk is
      # over WARN_PCT (that's the signal, surfaced via Prometheus rules).
      test: [
        "CMD-SHELL",
        "wget -qO- http://localhost:8099/metrics > /dev/null 2>&1 || exit 1",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=false"
    logging: *logging

  k6:
    image: grafana/k6:0.55.0
    profiles: [loadtest]
    user: "${K6_UID:-1000}:${K6_GID:-1000}"
    networks:
      - trading-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./k6:/scripts:ro
      - ./docs/site/src/data/loadtest:/output
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BASE_URL: ${BASE_URL:-http://gateway:5011}
      K6_TOKEN: ${K6_TOKEN:-}
      RUN_LABEL: ${RUN_LABEL:-baseline-limit}
      K6_PROMETHEUS_RW_SERVER_URL: ${K6_PROMETHEUS_RW_SERVER_URL:-http://host.docker.internal:9090/api/v1/write}
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(90),p(95),p(99),min,max"
    command:
      - run
      - --out
      - experimental-prometheus-rw
      - --summary-trend-stats=p(50),p(95),p(99),avg,max,min,med
      - /scripts/${K6_SCRIPT:-baseline-limit.js}
