      FIX_GATEWAY_HOST: fix-gateway
      FIX_GATEWAY_PORT: "9881"
      DISCORD_BOT_HOST: discord-bot
      DISCORD_BOT_PORT: "5034"
      REDPANDA_BROKERS: redpanda:9092
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BUG_WEBHOOK_URL: ${DISCORD_BUG_WEBHOOK_URL:-}
      GITHUB_TICKETING_REPO: ${GITHUB_TICKETING_REPO:-milesburton/veta-trading-platform}
      # Shared secret for the /loadgen-announce endpoint. When unset, the
      # endpoint is invisible (returns 404). When set, k6 loop scripts post
      # start/stop notifications to /loadgen-announce so the Discord alerts
      # channel knows when loadgen is active and can disregard the noise.
