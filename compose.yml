      LOAD_TEST_USER_IDS: ${LOAD_TEST_USER_IDS:-alice,amelia,bob,dave}
      PUBLIC_GUEST_TRADING: ${PUBLIC_GUEST_TRADING:-false}
      GUEST_SUBMIT_CAPACITY: "${GUEST_SUBMIT_CAPACITY:-10}"
      GUEST_SUBMIT_REFILL: "${GUEST_SUBMIT_REFILL:-1}"
      MARKET_SIM_HOST: market-sim
