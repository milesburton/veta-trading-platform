name: veta

networks:
  # internal: true means Docker never adds a default route to this network's
  # containers: no service on trading-net alone can reach the internet, only
  # other containers on the same network. This is the primary control for
  # threat-model Chain 3 (compromised dependency phoning home): a supply-chain
  # compromise in any of these ~18 services has nowhere to exfiltrate to.
  trading-net:
    driver: bridge
    internal: true
  # The handful of services with a genuine reason to reach the internet
  # (market-data's external quote providers, the gateway/discord-bot's Discord
  # webhook, ollama-model-pull's one-shot model download, and traefik as the
  # public ingress) additionally join this normal, internet-capable network.
  egress-net:
    driver: bridge

volumes:
  postgres-data:
  market-data-state:
  feature-engine-data:
  signal-engine-data:
  llm-advisory-data:
  letsencrypt:

x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

x-deno-service: &deno-service
  build:
    context: .
    dockerfile: docker/base/Dockerfile
  networks:
    - trading-net
  mem_limit: 512m
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  logging: *logging

x-deno-medium: &deno-medium
  build:
    context: .
    dockerfile: docker/base/Dockerfile
  networks:
    - trading-net
  mem_limit: 768m
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp
  logging: *logging

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    networks:
      - trading-net
    mem_limit: 1536m
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      - "traefik.enable=false"

  redpanda-init:
    image: redpandadata/redpanda:v24.3.6
    container_name: redpanda-init
    networks:
      - trading-net
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
          set -e
          rpk cluster config set log_retention_ms 21600000 --brokers redpanda:9092 || true
          rpk cluster config set retention_bytes 1073741824 --brokers redpanda:9092 || true
          TOPICS="market.ticks market.features market.signals algo.heartbeat orders.new orders.routed orders.child orders.filled fix.execution news.feed intelligence.recommendations"
          for TOPIC in $TOPICS; do
            rpk topic create "$TOPIC" --brokers redpanda:9092 2>/dev/null || true
          done
          rpk topic alter-config market.ticks    --set retention.bytes=524288000  --brokers redpanda:9092
          rpk topic alter-config market.ticks    --set retention.ms=3600000       --brokers redpanda:9092
          rpk topic alter-config market.ticks    --set max.message.bytes=4194304  --brokers redpanda:9092
          rpk topic alter-config market.features  --set retention.bytes=268435456  --brokers redpanda:9092
          rpk topic alter-config market.features  --set retention.ms=3600000       --brokers redpanda:9092
          rpk topic alter-config market.features  --set segment.bytes=67108864     --brokers redpanda:9092
          rpk topic alter-config market.signals   --set retention.bytes=268435456  --brokers redpanda:9092
          rpk topic alter-config market.signals   --set retention.ms=3600000       --brokers redpanda:9092
          rpk topic alter-config market.signals   --set segment.bytes=67108864     --brokers redpanda:9092
          rpk topic alter-config algo.heartbeat  --set retention.bytes=52428800   --brokers redpanda:9092
          rpk topic alter-config algo.heartbeat  --set retention.ms=1800000       --brokers redpanda:9092
          echo "Retention limits applied"
    labels:
      - "traefik.enable=false"

  redpanda-console:
    image: redpandadata/console:v2.7.2
    networks:
      - trading-net
    mem_limit: 128m
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVER_LISTENPORT: "8081"
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redpanda-console.rule=PathPrefix(`/admin/redpanda`)"
      - "traefik.http.routers.redpanda-console.entrypoints=web,websecure"
      - "traefik.http.routers.redpanda-console.middlewares=redpanda-strip"
      - "traefik.http.middlewares.redpanda-strip.stripprefix.prefixes=/admin/redpanda"
      - "traefik.http.services.redpanda-console.loadbalancer.server.port=8081"
      - "traefik.http.routers.redpanda-console.priority=15"

  postgres:
    image: postgres:16-alpine
    networks:
      - trading-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veta}
      POSTGRES_DB: ${POSTGRES_DB:-veta}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-veta}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=false"
    logging: *logging

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    networks:
      - trading-net
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-veta}:${POSTGRES_PASSWORD:-veta}@postgres:5432/${POSTGRES_DB:-veta}
    restart: "no"
    labels:
      - "traefik.enable=false"
    logging: *logging

  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    # Needs egress-net in addition to trading-net: the public ingress, so it
    # is intentionally internet-reachable by design (not a supply-chain
    # exfiltration risk in the same sense as the internal services).
    networks:
      - trading-net
      - egress-net
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - letsencrypt:/letsencrypt
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Dashboard is LAN-only on :8888; do not enable Traefik for itself
      # or a forwarding-rule change will publish it on the public hostname.
      - "traefik.enable=false"
    logging: *logging

  ollama:
    image: ollama/ollama:latest
    profiles: [trading]
    networks:
      - trading-net
    volumes:
      - llm-advisory-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    mem_limit: 3g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # ollama:latest ships without wget/curl; use the bundled CLI.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=false"
    logging: *logging

  ollama-model-pull:
    image: ollama/ollama:latest
    profiles: [trading]
    # Needs both: trading-net to reach the ollama container it configures via
    # OLLAMA_HOST, egress-net to pull the model from registry.ollama.ai. Runs
    # once at startup and exits (restart: "no"), so the egress window is brief.
    networks:
      - trading-net
      - egress-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - llm-advisory-data:/root/.ollama
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"
    labels:
      - "traefik.enable=false"
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_DEPLOYMENT: ${VITE_DEPLOYMENT:-local}
        VITE_BUILD_DATE: ${BUILD_DATE:-dev}
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - trading-net
    environment:
      FRONTEND_PORT: "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/__version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"
    logging: *logging

  market-sim:
    <<: *deno-medium
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/market-sim/market-sim.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      MARKET_SIM_PORT: "5000"
      JOURNAL_HOST: journal
      JOURNAL_PORT: "5009"
      MARKET_DATA_HOST: market-data
      MARKET_DATA_PORT: "5015"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-sim.rule=PathPrefix(`/api/market-sim`) || PathPrefix(`/ws/market-sim`)"
      - "traefik.http.routers.market-sim.entrypoints=web,websecure"
      - "traefik.http.routers.market-sim.middlewares=market-sim-strip"
      - "traefik.http.middlewares.market-sim-strip.stripprefix.prefixes=/api/market-sim,/ws/market-sim"
      - "traefik.http.services.market-sim.loadbalancer.server.port=5000"
      - "traefik.http.routers.market-sim.priority=10"

  ems:
    <<: *deno-medium
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/ems/ems-server.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      market-sim:
        condition: service_healthy
    environment:
      EMS_PORT: "5001"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      EMS_PARTICIPATION_CAP: "0.20"
      EMS_IMPACT_PER_1000_BPS: "1.0"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ems.rule=PathPrefix(`/api/ems`)"
      - "traefik.http.routers.ems.entrypoints=web,websecure"
      - "traefik.http.routers.ems.middlewares=ems-strip"
      - "traefik.http.middlewares.ems-strip.stripprefix.prefixes=/api/ems"
      - "traefik.http.services.ems.loadbalancer.server.port=5001"
      - "traefik.http.routers.ems.priority=10"

  oms:
    <<: *deno-medium
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/oms/oms-server.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      journal:
        condition: service_healthy
    environment:
      OMS_PORT: "5002"
      ALGO_HOST: limit-algo
      ALGO_TRADER_PORT: "5003"
      TWAP_ALGO_PORT: "5004"
      POV_ALGO_PORT: "5005"
      VWAP_ALGO_PORT: "5006"
      ICEBERG_ALGO_PORT: "5021"
      SNIPER_ALGO_PORT: "5022"
      ARRIVAL_PRICE_ALGO_PORT: "5023"
      MOMENTUM_ALGO_PORT: "5025"
      IS_ALGO_PORT: "5026"
      USER_SERVICE_HOST: user-service
      USER_SERVICE_PORT: "5008"
      RISK_ENGINE_HOST: risk-engine
      RISK_ENGINE_PORT: "5032"
      JOURNAL_HOST: journal
      JOURNAL_PORT: "5009"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oms.rule=PathPrefix(`/api/oms`)"
      - "traefik.http.routers.oms.entrypoints=web,websecure"
      - "traefik.http.routers.oms.middlewares=oms-strip"
      - "traefik.http.middlewares.oms-strip.stripprefix.prefixes=/api/oms"
      - "traefik.http.services.oms.loadbalancer.server.port=5002"
      - "traefik.http.routers.oms.priority=10"

  limit-algo:
    <<: *deno-service
    profiles: [trading]
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/algo/limit-strategy.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      ems:
        condition: service_healthy
    environment:
      ALGO_TRADER_PORT: "5003"
      EMS_HOST: ems
      EMS_PORT: "5001"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      KAFKA_RELAY_HOST: kafka-relay
      KAFKA_RELAY_PORT: "5007"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.limit-algo.rule=PathPrefix(`/api/limit-algo`)"
      - "traefik.http.routers.limit-algo.entrypoints=web,websecure"
      - "traefik.http.routers.limit-algo.middlewares=limit-algo-strip"
      - "traefik.http.middlewares.limit-algo-strip.stripprefix.prefixes=/api/limit-algo"
      - "traefik.http.services.limit-algo.loadbalancer.server.port=5003"
      - "traefik.http.routers.limit-algo.priority=10"

  twap-algo:
    <<: *deno-service
    profiles: [trading]
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/algo/twap-strategy.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      ems:
        condition: service_healthy
    environment:
      TWAP_ALGO_PORT: "5004"
      EMS_HOST: ems
      EMS_PORT: "5001"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      TWAP_INTERVAL_MS: "5000"
      KAFKA_RELAY_HOST: kafka-relay
      KAFKA_RELAY_PORT: "5007"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.twap-algo.rule=PathPrefix(`/api/twap-algo`)"
      - "traefik.http.routers.twap-algo.entrypoints=web,websecure"
      - "traefik.http.routers.twap-algo.middlewares=twap-algo-strip"
      - "traefik.http.middlewares.twap-algo-strip.stripprefix.prefixes=/api/twap-algo"
      - "traefik.http.services.twap-algo.loadbalancer.server.port=5004"
      - "traefik.http.routers.twap-algo.priority=10"

  pov-algo:
    <<: *deno-service
    profiles: [trading]
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/algo/pov-strategy.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      ems:
        condition: service_healthy
    environment:
      POV_ALGO_PORT: "5005"
      EMS_HOST: ems
      EMS_PORT: "5001"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      POV_PERCENTAGE: "10"
      POV_MIN_SLICE: "10"
      POV_MAX_SLICE: "5000"
      KAFKA_RELAY_HOST: kafka-relay
      KAFKA_RELAY_PORT: "5007"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pov-algo.rule=PathPrefix(`/api/pov-algo`)"
      - "traefik.http.routers.pov-algo.entrypoints=web,websecure"
      - "traefik.http.routers.pov-algo.middlewares=pov-algo-strip"
      - "traefik.http.middlewares.pov-algo-strip.stripprefix.prefixes=/api/pov-algo"
      - "traefik.http.services.pov-algo.loadbalancer.server.port=5005"
      - "traefik.http.routers.pov-algo.priority=10"

  vwap-algo:
    <<: *deno-service
    profiles: [trading]
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/algo/vwap-strategy.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      ems:
        condition: service_healthy
    environment:
      VWAP_ALGO_PORT: "5006"
      EMS_HOST: ems
      EMS_PORT: "5001"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      VWAP_WINDOW_TICKS: "20"
      KAFKA_RELAY_HOST: kafka-relay
      KAFKA_RELAY_PORT: "5007"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5006/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vwap-algo.rule=PathPrefix(`/api/vwap-algo`)"
      - "traefik.http.routers.vwap-algo.entrypoints=web,websecure"
      - "traefik.http.routers.vwap-algo.middlewares=vwap-algo-strip"
      - "traefik.http.middlewares.vwap-algo-strip.stripprefix.prefixes=/api/vwap-algo"
      - "traefik.http.services.vwap-algo.loadbalancer.server.port=5006"
      - "traefik.http.routers.vwap-algo.priority=10"

  iceberg-algo:
    <<: *deno-service
    profiles: [trading]
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/algo/iceberg-strategy.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      ems:
        condition: service_healthy
    environment:
      ICEBERG_ALGO_PORT: "5021"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      EMS_HOST: ems
      EMS_PORT: "5001"
      KAFKA_RELAY_HOST: kafka-relay
      KAFKA_RELAY_PORT: "5007"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5021/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iceberg-algo.rule=PathPrefix(`/api/iceberg-algo`)"
      - "traefik.http.routers.iceberg-algo.entrypoints=web,websecure"
      - "traefik.http.routers.iceberg-algo.middlewares=iceberg-algo-strip"
      - "traefik.http.middlewares.iceberg-algo-strip.stripprefix.prefixes=/api/iceberg-algo"
      - "traefik.http.services.iceberg-algo.loadbalancer.server.port=5021"
      - "traefik.http.routers.iceberg-algo.priority=10"

  sniper-algo:
    <<: *deno-service
    profiles: [trading]
    command: [
      "deno",
      "run",
      "--allow-all",
      "/app/backend/src/algo/sniper-strategy.ts",
    ]
    depends_on:
      redpanda:
        condition: service_healthy
      ems:
        condition: service_healthy
    environment:
      SNIPER_ALGO_PORT: "5022"
      MARKET_SIM_HOST: market-sim
      MARKET_SIM_PORT: "5000"
      EMS_HOST: ems
      EMS_PORT: "5001"
      KAFKA_RELAY_HOST: kafka-relay
      KAFKA_RELAY_PORT: "5007"
      REDPANDA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5022/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
