      - "traefik.http.routers.fix-exchange.middlewares=fix-exchange-strip"
      - "traefik.http.services.fix-exchange.loadbalancer.server.port=9880"
      - "traefik.http.routers.fix-exchange.priority=10"

  # fix-gateway is the browser-facing edge of the FIX stack (WS -> TCP
  # bridge to fix-exchange). It's the trust boundary, so TLS terminates
  # here (entrypoints=websecure, tls=true) and a per-IP rate limit applies
  # — same pattern the main gateway already uses for its own WS route.
  # The internal TCP hop from fix-gateway to fix-exchange stays plaintext
  # deliberately: both processes are on the trusted internal network, and
  # that hop was never the trust boundary in the first place. This is a
  # coarse, per-IP/per-connection limit; a tighter SenderCompID-keyed
  # limit at fix-exchange itself is a separate, larger change (fix-gateway
  # proxies every client through one TCP connection pool, so IP-based
  # limiting at fix-exchange's own layer would only ever see fix-gateway's
  # address — see fix-protocol.mdx's known gaps).
  fix-gateway:
    <<: *prod-defaults
    image: ghcr.io/milesburton/veta-trading-platform/fix-gateway:latest
    build: !reset null
    profiles: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.fix-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.fix-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.fix-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      - "traefik.http.routers.fix-gateway.rule=PathPrefix(`/api/fix-gateway`)"
      - "traefik.http.routers.fix-gateway.entrypoints=websecure"
      - "traefik.http.routers.fix-gateway.tls=true"
      - "traefik.http.routers.fix-gateway.middlewares=fix-gateway-strip,fix-ratelimit"
      - "traefik.http.services.fix-gateway.loadbalancer.server.port=9881"
      - "traefik.http.routers.fix-gateway.priority=10"
      - "traefik.http.routers.fix-gateway-ws.rule=PathPrefix(`/ws/fix`)"
      - "traefik.http.routers.fix-gateway-ws.entrypoints=websecure"
      - "traefik.http.routers.fix-gateway-ws.tls=true"
      - "traefik.http.routers.fix-gateway-ws.middlewares=fix-ratelimit"
      - "traefik.http.routers.fix-gateway-ws.service=fix-gateway"
      - "traefik.http.routers.fix-gateway-ws.priority=10"

