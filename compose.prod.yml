  # Gateway is the platform's CPU bottleneck under load — Deno is single-
  # threaded and one replica pegs at one core. Scale horizontally with
  # `docker compose ... up -d --scale gateway=N` (or set GATEWAY_REPLICAS
  # in the deploy environment; deploy.sh wires it up).
  #
  # Sticky cookie ensures WebSocket connections + their associated HTTP
  # requests land on the same replica. In-process WS state (subscription
  # maps, pending signal/feature debounce buffers) stays consistent.
  # The upgradeInProgress flag is per-replica today — if it diverges,
  # set UPGRADE_IN_PROGRESS via env on all replicas at once.
  gateway:
    <<: *prod-defaults
    image: ghcr.io/milesburton/veta-trading-platform/gateway:latest
    build: !reset null
    profiles: !reset []
    environment:
      GITHUB_TICKETING_TOKEN_FILE: /run/secrets/github_ticketing_token
    secrets:
      - github_ticketing_token
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=60"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      # ADR 0005: hold a request that lands in the gap between the old
      # gateway container stopping and the new one passing its health
      # check, instead of surfacing a 502/dropped connection to the client.
      - "traefik.http.middlewares.deploy-retry.retry.attempts=4"
      - "traefik.http.middlewares.deploy-retry.retry.initialinterval=100ms"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api/gateway`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls=true"
      - "traefik.http.routers.gateway.middlewares=gateway-strip,deploy-retry,api-ratelimit"
      - "traefik.http.services.gateway.loadbalancer.server.port=5011"
      - "traefik.http.services.gateway.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.gateway.loadbalancer.sticky.cookie.name=veta_gw"
      - "traefik.http.services.gateway.loadbalancer.sticky.cookie.httpOnly=true"
      # Health-gate this router specifically — Traefik stops sending
      # traffic to a gateway container the moment it fails /health,
      # rather than only when the container disappears entirely. With
      # one replica this narrows the swap-window error rather than
      # eliminating it; it matters more once GATEWAY_REPLICAS > 1.
      - "traefik.http.services.gateway.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.interval=5s"
      - "traefik.http.services.gateway.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.routers.gateway.priority=20"
      # deploy-retry is deliberately not applied here: it retries an HTTP
      # request, and a WebSocket upgrade handshake is not one Traefik can
      # safely replay mid-negotiation. The frontend's own reconnect-with-
      # backoff (gatewayMiddleware.ts) already covers a dropped socket
      # during the gateway's swap window.
      - "traefik.http.routers.gateway-ws.rule=PathPrefix(`/ws/gateway`)"
      - "traefik.http.routers.gateway-ws.entrypoints=websecure"
      - "traefik.http.routers.gateway-ws.tls=true"
      - "traefik.http.routers.gateway-ws.middlewares=api-ratelimit"
      - "traefik.http.routers.gateway-ws.service=gateway"
      - "traefik.http.routers.gateway-ws.priority=20"
      - "traefik.http.routers.health.rule=Path(`/health`)"
      - "traefik.http.routers.health.entrypoints=websecure"
      - "traefik.http.routers.health.tls=true"
      - "traefik.http.routers.health.service=gateway"
      - "traefik.http.routers.health.priority=25"

