# Homelab prod override — internal Dockge-managed VM serving veta.mnetcs.com.
# Usage: docker compose -f compose.yml -f compose.prod.yml up -d

x-prod-image: &prod-defaults
  restart: unless-stopped

secrets:
  # Provisioned on the host as root:1993 mode 0640 (1993 is the unprivileged
  # deno group in the gateway image). It is deliberately outside .env so
  # Compose never places the GitHub credential in a container environment.
  github_ticketing_token:
    file: ./secrets/github_ticketing_token

services:

  # Infrastructure — persistent, never auto-restarted on image change.
  redpanda:
    <<: *prod-defaults
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=2
      - --memory=1536M
      - --default-log-level=warn
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    mem_limit: 2g
    labels:
      - "traefik.enable=false"

  postgres:
    <<: *prod-defaults
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    mem_limit: 1g
    labels:
      - "traefik.enable=false"

  # Deliberately public, GitHub needs unauthenticated GET to render ticket
  # attachment images inline in an issue body, so this bucket is anonymous
  # -read by design (see minio-init in compose.yml). Unlike every other
  # backend service here, this one keeps traefik.enable=true in prod: it is
  # meant to be reachable directly, not only via the gateway's proxy.
  minio:
    <<: *prod-defaults
    mem_limit: 512m

  # Application services — pulled from GHCR by the homelab auto-pull.
  frontend:
    <<: *prod-defaults
    image: ghcr.io/milesburton/veta-trading-platform/frontend:latest
    build: !reset null
    profiles: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.origin-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.origin-ratelimit.ratelimit.burst=120"
      - "traefik.http.middlewares.origin-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.middlewares=origin-ratelimit"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"

  # This helper shares the Deno base image and supplies its own command in
  # compose.yml. Giving it a published production image prevents image-only
  # homelab deployments from depending on a locally built veta-discord-bot.
  discord-bot:
    <<: *prod-defaults
    image: ghcr.io/milesburton/veta-trading-platform/base:latest
    build: !reset null
    profiles: !reset []

  market-sim:
    <<: *prod-defaults
    image: ghcr.io/milesburton/veta-trading-platform/market-sim:latest
    build: !reset null
    profiles: !reset []
    labels:
      - "traefik.enable=false"
      - "traefik.http.routers.market-sim.rule=PathPrefix(`/api/market-sim`) || PathPrefix(`/ws/market-sim`)"
      - "traefik.http.routers.market-sim.entrypoints=web"
      - "traefik.http.routers.market-sim.middlewares=market-sim-strip"
      - "traefik.http.services.market-sim.loadbalancer.server.port=5000"
      - "traefik.http.routers.market-sim.priority=10"

  ems:
    <<: *prod-defaults
    image: ghcr.io/milesburton/veta-trading-platform/ems:latest
    build: !reset null
    profiles: !reset []
    labels:
      - "traefik.enable=false"
