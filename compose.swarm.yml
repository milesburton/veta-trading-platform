# `veta_trading-net` already exists on the homelab as a bridge created by
# other compose projects (caddy serves the wiki; lgtm-grafana provides
# Grafana). They attach to it to reach trading services. Swapping the
# driver to `overlay` here would force-recreate the network and disconnect
# those stacks. Mark it `external: true` instead: swarm joins the existing
# bridge rather than owning the network. Single-node Swarm doesn't need
# overlay's cross-host features; revisit if/when multi-host is on the table.
networks:
  trading-net:
    external: true
    name: veta_trading-net

x-app-deploy: &app-deploy
  replicas: 1
  update_config:
    order: start-first
    parallelism: 1
    failure_action: rollback
    monitor: 60s
    delay: 5s
  rollback_config:
    order: stop-first
    parallelism: 1
    delay: 5s
  restart_policy:
    condition: any
    delay: 5s
    max_attempts: 10
    window: 60s

x-once-deploy: &once-deploy
  replicas: 1
  restart_policy:
    condition: none

x-infra-deploy: &infra-deploy
  replicas: 1
  update_config:
    order: stop-first
    parallelism: 1
    failure_action: pause
  restart_policy:
    condition: any
    delay: 5s
    window: 60s

services:

  redpanda:
    deploy:
      <<: *infra-deploy
      resources:
        limits:
          memory: 768M

  postgres:
    deploy:
      <<: *infra-deploy

  traefik:
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 60s

  frontend:
    deploy: *app-deploy
  market-sim:
    deploy: *app-deploy
  ems:
    deploy: *app-deploy
  oms:
    deploy: *app-deploy
  gateway:
    deploy: *app-deploy
  user-service:
    deploy: *app-deploy
  journal:
    deploy: *app-deploy
  kafka-relay:
    deploy: *app-deploy
  risk-engine:
    deploy: *app-deploy
  analytics:
    deploy: *app-deploy
  market-data:
    deploy: *app-deploy
  market-data-adapters:
    deploy: *app-deploy
  feature-engine:
    deploy: *app-deploy
  signal-engine:
    deploy: *app-deploy
  recommendation-engine:
    deploy: *app-deploy
  scenario-engine:
    deploy: *app-deploy
  news-aggregator:
    deploy: *app-deploy
  llm-advisory:
    deploy: *app-deploy
  llm-worker:
    deploy: *app-deploy

  limit-algo:
    deploy: *app-deploy
  twap-algo:
    deploy: *app-deploy
  pov-algo:
    deploy: *app-deploy
  vwap-algo:
    deploy: *app-deploy
  iceberg-algo:
    deploy: *app-deploy
  sniper-algo:
    deploy: *app-deploy
  arrival-price-algo:
    deploy: *app-deploy
  momentum-algo:
    deploy: *app-deploy
  is-algo:
    deploy: *app-deploy

  dark-pool:
    deploy: *app-deploy
  ccp-service:
    deploy: *app-deploy
  rfq-service:
    deploy: *app-deploy
  product-service:
    deploy: *app-deploy
  replay-service:
    deploy: *app-deploy
  fix-exchange:
    deploy: *app-deploy
  fix-gateway:
    deploy: *app-deploy
  fix-archive:
    deploy: *app-deploy

  db-migrate:
    deploy: *once-deploy

  redpanda-console:
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        window: 60s
