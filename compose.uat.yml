x-uat-image: &uat-defaults
  restart: unless-stopped

services:

  redpanda:
    <<: *uat-defaults
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=384M
      - --default-log-level=warn
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    mem_limit: 512m
    labels:
      - "traefik.enable=false"

  postgres:
    <<: *uat-defaults
    ports: !override
      - "8432:5432"
    mem_limit: 512m
    labels:
      - "traefik.enable=false"

  traefik:
    <<: *uat-defaults
    ports: !override
      - "8080:80"
      - "8443:443"
      - "8989:8080"
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.uat.yml:/traefik.yml:ro
    mem_limit: 96m
    labels:
      - "traefik.enable=false"

  disk-monitor:
    <<: *uat-defaults
    ports: !override
      - "8199:8099"
    mem_limit: 32m

  frontend:
    <<: *uat-defaults
    image: ghcr.io/milesburton/veta-trading-platform/frontend:latest
    build: !reset null
    profiles: !reset []
    mem_limit: 128m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"

  market-sim:
    <<: *uat-defaults
    image: ghcr.io/milesburton/veta-trading-platform/market-sim:latest
    build: !reset null
    profiles: !reset []
    mem_limit: 384m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-sim.rule=PathPrefix(`/api/market-sim`) || PathPrefix(`/ws/market-sim`)"
      - "traefik.http.routers.market-sim.entrypoints=web"
      - "traefik.http.routers.market-sim.middlewares=market-sim-strip"
      - "traefik.http.middlewares.market-sim-strip.stripprefix.prefixes=/api/market-sim"
      - "traefik.http.services.market-sim.loadbalancer.server.port=5000"
      - "traefik.http.routers.market-sim.priority=10"

  ems:
    <<: *uat-defaults
    image: ghcr.io/milesburton/veta-trading-platform/ems:latest
    build: !reset null
    profiles: !reset []
    mem_limit: 256m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ems.rule=PathPrefix(`/api/ems`)"
      - "traefik.http.routers.ems.entrypoints=web"
      - "traefik.http.routers.ems.middlewares=ems-strip"
      - "traefik.http.middlewares.ems-strip.stripprefix.prefixes=/api/ems"
      - "traefik.http.services.ems.loadbalancer.server.port=5001"
      - "traefik.http.routers.ems.priority=10"

  oms:
    <<: *uat-defaults
    image: ghcr.io/milesburton/veta-trading-platform/oms:latest
    build: !reset null
    profiles: !reset []
    mem_limit: 256m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oms.rule=PathPrefix(`/api/oms`)"
      - "traefik.http.routers.oms.entrypoints=web"
      - "traefik.http.routers.oms.middlewares=oms-strip"
      - "traefik.http.middlewares.oms-strip.stripprefix.prefixes=/api/oms"
      - "traefik.http.services.oms.loadbalancer.server.port=5002"
      - "traefik.http.routers.oms.priority=10"

  gateway:
    <<: *uat-defaults
    image: ghcr.io/milesburton/veta-trading-platform/gateway:latest
    build: !reset null
    profiles: !reset []
    mem_limit: 384m
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api/gateway`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.middlewares=gateway-strip"
      - "traefik.http.middlewares.gateway-strip.stripprefix.prefixes=/api/gateway"
      - "traefik.http.services.gateway.loadbalancer.server.port=5011"
      - "traefik.http.routers.gateway.priority=20"
      - "traefik.http.routers.gateway-ws.rule=PathPrefix(`/ws/gateway`)"
      - "traefik.http.routers.gateway-ws.entrypoints=web"
      - "traefik.http.routers.gateway-ws.service=gateway"
      - "traefik.http.routers.gateway-ws.priority=20"
      - "traefik.http.routers.health.rule=Path(`/health`)"
      - "traefik.http.routers.health.entrypoints=web"
      - "traefik.http.routers.health.service=gateway"
      - "traefik.http.routers.health.priority=25"

  user-service:
    <<: *uat-defaults
    image: ghcr.io/milesburton/veta-trading-platform/user-service:latest
    build: !reset null
    profiles: !reset []
    mem_limit: 256m
    labels:
