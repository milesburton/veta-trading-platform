services:
  alloy:
    image: grafana/alloy:v1.7.0
    container_name: lgtm-alloy
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "12345:12345" # Alloy UI
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy --server.http.listen-addr=0.0.0.0:12345
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lgtm
    restart: unless-stopped
    mem_limit: 512m

  loki:
    image: grafana/loki:3.3.2
    container_name: lgtm-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lgtm
    restart: unless-stopped
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: lgtm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    networks:
      - lgtm
      - veta_trading-net
    restart: unless-stopped
    mem_limit: 768m

  tempo:
    image: grafana/tempo:2.7.1
    container_name: lgtm-tempo
    ports:
      - "3200:3200"
      - "4319:4317" # Tempo's own OTLP gRPC (offset to avoid conflict with alloy)
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/tempo.yaml
    networks:
      - lgtm
    restart: unless-stopped
    mem_limit: 512m

  grafana:
    image: grafana/grafana:11.4.0
    container_name: lgtm-grafana
    ports:
      - "3000:3000"
    environment:
      # Anonymous users get read-only Viewer access: they can open
      # dashboards and explore data, but cannot edit panels, save
      # changes, install plugins, or manage users. Editing requires
      # signing in as an admin via the login form.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # Admin credentials. Override GF_SECURITY_ADMIN_PASSWORD in
      # /opt/stacks/veta/.env (or per-environment .env) to a strong
      # value before exposing publicly. The default is intentionally
      # not "admin/admin" so an unconfigured deploy fails to log in
      # rather than silently inheriting the well-known credential.
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_IN_DOTENV}"
      GF_FEATURE_TOGGLES_ENABLE: "traceToMetrics,traceToLogs"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_RENDERING_SERVER_URL: "http://renderer:8081/render"
      # Must include the sub-path. With GF_SERVER_SERVE_FROM_SUB_PATH=true,
      # Grafana redirects every /d-solo/ request to /grafana/d-solo/. The
      # renderer's headless Chromium would follow the redirect to the
      # rewritten host (localhost) and get ERR_CONNECTION_REFUSED. By
      # giving Chromium the sub-path URL directly we skip the redirect
      # entirely. 2026-05-20: panel-render attempts were silently failing
      # with this for an unknown time before the disk-fill incident
      # surfaced the broken alerting plumbing.
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/grafana/"
      GF_LOG_FILTERS: "rendering:debug"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/json/trading.json"
      # GF_INSTALL_PLUGINS intentionally unset: the previously-installed
      # grafana-mermaid-panel slug no longer exists in Grafana's plugin
      # catalog, causing the container to crash-loop on startup. The
      # order-pipeline-traces dashboard's flowchart panel will render as
      # "panel not installed" until a working mermaid/flowchart plugin is
      # picked. Trading is unaffected.
      # Used by provisioning/alerting/contact-points.yml. Grafana 11.4
      # rejects an empty `url` on a webhook receiver at provisioning
      # time and crash-loops the container, so the default has to be a
      # syntactically valid URL. The sentinels below are unreachable —
      # webhook send attempts will fail with a connection error logged
      # by Grafana, but the UI keeps working.
      #
      # On the homelab, /opt/stacks/veta/observability/.env is a symlink
      # to ../.env so compose's project-local env lookup picks up the
      # parent stack's DISCORD_WEBHOOK_URL. Without the symlink the
      # observability compose project would only see vars defined in
      # its own dir (which is empty by default), and the sentinels
      # would win. The deploy script ensures the symlink exists.
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-http://alerts-not-configured.invalid/}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/REPLACE_ME}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - lgtm
      - veta_trading-net
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
      - tempo
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=veta_trading-net"
      # Authentication is enforced by Grafana itself: anonymous visitors
      # get Viewer (read-only) access; admin and edit operations require
      # signing in via the Grafana login form (see GF_AUTH_ANONYMOUS_*
      # and GF_SECURITY_ADMIN_PASSWORD above). The previous Traefik
      # BasicAuth middleware was removed because it short-circuited the
      # request before Grafana could serve the anonymous read view.
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=origin-ratelimit"
      - "traefik.http.routers.grafana.priority=30"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    mem_limit: 512m

  renderer:
    image: grafana/grafana-image-renderer:3.12.5
    container_name: lgtm-renderer
    environment:
      ENABLE_METRICS: "true"
    networks:
      - lgtm
    restart: unless-stopped
    mem_limit: 768m

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  lgtm:
    driver: bridge
  veta_trading-net:
    external: true
