global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: trading-sim
    env: dev

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: disk-monitor
    metrics_path: /metrics
    static_configs:
      - targets:
          - veta-disk-monitor:8099
