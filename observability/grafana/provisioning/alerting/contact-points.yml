apiVersion: 1

# Alert contact points + notification policy. Routes alerts to Discord via
# DISCORD_WEBHOOK_URL (per-host secret, never committed). Falls back to
# the generic ALERT_WEBHOOK_URL receiver if Discord is unset — Grafana 11.4
# refuses to provision a webhook receiver with an empty URL.

contactPoints:
  - orgId: 1
    name: veta-alerts
    receivers:
      - uid: discord-veta-alerts
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          title: |
            {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          message: |
            {{ range .Alerts }}
            **{{ .Annotations.summary }}**
            {{ .Annotations.description }}
            {{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: security-alerts
    receivers:
      - uid: security-webhook
        type: webhook
        settings:
          url: ${ALERT_WEBHOOK_URL}
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: veta-alerts
    group_by: [alertname, severity]
    repeat_interval: 24h
    group_wait: 30s
    group_interval: 5m
    routes:
      - receiver: security-alerts
        matchers:
          - category = security
