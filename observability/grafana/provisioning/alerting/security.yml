apiVersion: 1

groups:
  - orgId: 1
    name: security
    folder: VETA
    interval: 1m
    rules:
      - uid: auth-failure-spike
        title: Auth-failure spike
        condition: B
        # Loki query: counts auth_failure events from the gateway over the
        # last 5 minutes. Both the WARN logger.info(access_event)
        # serialisation and the underlying access-log lines should match
        # `auth_failure` in body. Excludes events tagged with
        # `"source":"loadgen"` — loadgen tooling (k6) is identified by its
        # User-Agent at access-event time and noise from automated traffic
        # would otherwise drown real signal during a load run.
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="gateway"} |= "auth_failure" != "\"source\":\"loadgen\"" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: 'More than 5 auth_failure events from the gateway in the last 5 minutes. Possible credential-stuffing or scanning attempt. Loki query: `{service_name="gateway"} |= "auth_failure" | json` to investigate.'
          summary: Auth failure rate exceeded threshold
        labels:
          severity: high
        isPaused: false

      - uid: ws-rate-limited-spike
        title: WebSocket rate-limit hit repeatedly
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="gateway"} |= "ws_rate_limited" != "\"source\":\"loadgen\"" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: 'More than 20 ws_rate_limited events from the gateway in 5 minutes. One client is repeatedly hitting the per-socket frame rate limit — investigate whether this is a misbehaving client or an attack.'
          summary: WebSocket frame rate-limit triggered repeatedly
        labels:
          severity: medium
        isPaused: false

      - uid: ws-abuse-disconnect
        title: WebSocket force-closed for abuse
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="gateway"} |= "ws_disconnected_abuse" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          description: 'More than 3 ws_disconnected_abuse events in 5 minutes. The gateway escalated past rate-limiting to force-closing sockets. Check the userId in the log lines — if one user is repeatedly hitting this, consider revoking their session.'
          summary: WebSocket sockets force-closed for abuse
        labels:
          severity: high
        isPaused: false

      - uid: ws-user-backoff
        title: User blocked from new WebSocket connections
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({service_name="gateway"} |= "ws_blocked" [10m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              hide: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          description: 'A user-level WebSocket backoff is active. The gateway accumulated enough force-closes for one userId in 5 minutes to refuse new upgrades. Find the userId in the ws_blocked log line; the backoff auto-clears after 5 minutes but if it recurs, treat as a real abuse case.'
          summary: WebSocket user-level backoff engaged
        labels:
          severity: high
        isPaused: false
