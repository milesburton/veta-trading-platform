apiVersion: 1

# Grafana-managed alert rules for the **host and Redpanda** groups.
# These mirror the same expressions as the same-named groups in
# observability/prometheus-rules.yml so Prometheus and Grafana agree
# on alert state, but they need to live here too because Grafana's
# notification policy + Discord contact point only fires for
# Grafana-managed rules. Prometheus-side rules are not wired into
# any alertmanager, so before this file existed they evaluated
# silently and never reached the channel.
#
# Out of scope for this file (still Prometheus-only, not Discord-routed):
#   - the `memory` group (ServiceMemoryGrowth/High/Critical)
#   - the `frontend-memory` group (FrontendHeapHigh/Critical)
# Migrating those is a follow-up — they need the same per-rule
# Grafana provisioning shape and were left out of PR #338 to keep
# the scope tight on the disk-fill incident pipeline.

groups:
  - orgId: 1
    name: host
    folder: VETA
    interval: 30s
    rules:
      - uid: disk-usage-high
        title: Host disk usage above 80%
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: disk_used_percent
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [80], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Host disk above 80% for 5m
          description: |
            disk_used_percent is above 80%. Past incident: kafka-relay
            log spam filled the disk at 100% and took out the site.
            Investigate container log file sizes:
              sudo du -sh /var/lib/docker/containers/*/*.log | sort -h | tail -5
        labels:
          severity: warning
        isPaused: false

      - uid: disk-usage-critical
        title: Host disk usage above 92%
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: disk_used_percent
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [92], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Host disk above 92% — imminent outage
          description: |
            disk_used_percent is above 92%. Docker exec, healthchecks,
            and Traefik label reads start failing around 95%. Truncate
            the largest container log immediately — find its log path
            with `docker inspect <container> | jq -r '.[0].LogPath'`,
            then `sudo truncate -s 0` the resulting file.
        labels:
          severity: critical
        isPaused: false

      - uid: disk-monitor-down
        title: disk-monitor scrape failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: up{job="disk-monitor"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: disk-monitor scrape failing for 5m
          description: |
            Prometheus can't scrape disk-monitor:8099/metrics. Disk
            could be filling without anyone seeing it. Check the
            container with `docker ps --filter name=disk-monitor`
            and `docker exec veta-disk-monitor wget -qO- http://localhost:8099/metrics`.
        labels:
          severity: warning
        isPaused: false

  - orgId: 1
    name: redpanda
    folder: VETA
    interval: 1m
    rules:
      - uid: redpanda-scrape-down
        title: Redpanda scrape failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: up{job="redpanda"}
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Redpanda scrape failing for 5m
          description: |
            Prometheus can't scrape redpanda:9644/public_metrics.
            Topic growth, consumer lag and partition health are
            invisible while this is down. Check the broker:
              docker exec redpanda rpk cluster health
        labels:
          severity: warning
        isPaused: false

      - uid: redpanda-topic-write-rate-high
        title: Redpanda topic write rate above 512 KiB/s
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: |
                sum by (redpanda_topic) (
                  rate(redpanda_kafka_request_bytes_total{
                    redpanda_request="produce",
                    redpanda_topic!~"market\\.ticks|market\\.features|market\\.signals"
                  }[10m])
                )
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [524288], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: A Redpanda topic is producing >512 KiB/s for 30m
          description: |
            One or more topics are taking writes at >512 KiB/s
            sustained — that's ~1.5 GiB/hour, ~36 GiB/day. At the
            cluster default retention.bytes=1 GiB and
            log_retention_ms=24h, the partition will hit the byte cap
            and start tombstoning. This rate also signals upstream
            spam. Past incident 2026-05-19: loadgen produced 322k
            duplicate AAPL orders/hr that all rejected to
            orders.rejected. Check the producer identity and message
            content before assuming it's organic.
        labels:
          severity: warning
        isPaused: false

      - uid: redpanda-topic-write-rate-critical
        title: Redpanda topic write rate above 2 MiB/s
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: |
                sum by (redpanda_topic) (
                  rate(redpanda_kafka_request_bytes_total{
                    redpanda_request="produce",
                    redpanda_topic!~"market\\.ticks|market\\.features|market\\.signals"
                  }[10m])
                )
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [2097152], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: A Redpanda topic is producing >2 MiB/s — disk-fill imminent
          description: |
            One or more topics are taking writes at >2 MiB/s. That's
            ~7 GiB/hour. Per-partition retention.bytes will tombstone,
            but multiple hot topics together can still outpace
            deletion. Confirm the producer is intentional; consider
            stopping the offending service.
        labels:
          severity: critical
        isPaused: false

      - uid: redpanda-unavailable-partitions
        title: Redpanda has partitions without quorum
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: redpanda_cluster_unavailable_partitions
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: Redpanda has partitions without quorum
          description: |
            redpanda_cluster_unavailable_partitions is non-zero.
            Producers writing to these partitions block; consumers
            can't read. Check broker health and storage. If the
            cluster is in a stuck state-machine-apply loop (like
            2026-05-20), recovery is to stop+wipe the data volume.
        labels:
          severity: critical
        isPaused: false
