groups:
  - name: host
    rules:
      - alert: DiskUsageHigh
        expr: disk_used_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Host disk above 80% for 5m
          description: |
            disk_used_percent is {{ $value }}%. Past incident: kafka-relay
            log spam filled the disk at 100% and took out the site. Investigate
            container log file sizes:
              sudo du -sh /var/lib/docker/containers/*/*.log | sort -h | tail -5

      - alert: DiskUsageCritical
        expr: disk_used_percent > 92
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Host disk above 92% — imminent outage
          description: |
            disk_used_percent is {{ $value }}%. Docker exec, healthchecks,
            and Traefik label reads start failing around 95%. Truncate the
            largest container log immediately:
              sudo truncate -s 0 $(docker inspect <container> --format '{{.LogPath}}')

      - alert: DiskMonitorDown
        expr: up{job="disk-monitor"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: disk-monitor scrape failing for 5m
          description: |
            Prometheus can't scrape disk-monitor:8099/metrics. Disk could
            be filling without anyone seeing it. Check the container.

  - name: memory
    rules:
      - alert: ServiceMemoryGrowthSustained
        expr: rate(v8js_memory_heap_size_bytes[5m]) > 1048576
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap growing >1 MiB/s for 15m"
          description: |
            v8js_memory_heap_size_bytes for {{ $labels.job }} has been
            growing at {{ $value | humanize }} bytes/s for 15 minutes.
            Likely a leak similar to the Firefox/Redux .push case on
            2026-05-18. Check unbounded slice growth, missing
            clearInterval / clearTimeout, or accumulating event handlers.

      - alert: ServiceMemoryHigh
        expr: v8js_memory_heap_size_bytes > 1.5e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} heap above 1.5 GiB for 10m"
          description: |
            v8js_memory_heap_size_bytes is {{ $value | humanize }}.
            The 12 GiB homelab VM has limited headroom across 21 services;
            sustained 1.5 GiB per service starves the rest.

      - alert: ServiceMemoryCritical
        expr: v8js_memory_heap_size_bytes > 3e9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} heap above 3 GiB — imminent OOM"
          description: |
            v8js_memory_heap_size_bytes is {{ $value | humanize }}.
            Deno usually OOMs around 4 GiB without --max-old-space-size.
            Restart the container and capture a heap snapshot via
            chrome://inspect before it dies on its own.

  - name: frontend-memory
    rules:
      - alert: FrontendHeapHigh
        expr: frontend_memory_heap_used_max_bytes > 2e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Browser heap above 2 GiB across at least one user for 10m
          description: |
            frontend_memory_heap_used_max_bytes is {{ $value | humanize }}.
            At least one live browser session is sitting on >2 GiB heap.
            Similar pattern to the Firefox 13 GB leak on 2026-05-18 —
            check for new unbounded growth in Redux slices.

      - alert: FrontendHeapCritical
        expr: frontend_memory_heap_used_max_bytes > 4e9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Browser heap above 4 GiB — likely frozen tab imminent
          description: |
            frontend_memory_heap_used_max_bytes is {{ $value | humanize }}.
            At 4 GiB Firefox typically starts swapping. Get the user to
            hard-refresh before the tab becomes unresponsive, and grab a
            heap snapshot from about:memory.

  - name: redpanda
    rules:
      - alert: RedpandaScrapeDown
        expr: up{job="redpanda"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Redpanda scrape failing for 5m
          description: |
            Prometheus can't scrape redpanda:9644/public_metrics. Topic
            growth, consumer lag, and partition health are invisible
            while this is down. Check the broker:
              docker exec redpanda rpk cluster health

      - alert: RedpandaTopicWriteRateHigh
        expr: |
          sum by (topic) (
            rate(redpanda_kafka_request_bytes_total{redpanda_request="produce"}[10m])
          ) > 524288
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.topic }} producing >512 KiB/s for 30m"
          description: |
            Topic {{ $labels.topic }} is taking writes at >512 KiB/s
            sustained — that's ~1.5 GiB/hour, ~36 GiB/day. At the cluster
            default retention.bytes=1 GiB and log_retention_ms=24h the
            partition will hit the byte cap and start tombstoning, but
            this rate also signals upstream spam. Past incident
            (2026-05-19): loadgen produced 322k duplicate AAPL orders/hr
            that all rejected to orders.rejected. Check producer
            identity and message content before assuming it's organic.

      - alert: RedpandaTopicWriteRateCritical
        expr: |
          sum by (topic) (
            rate(redpanda_kafka_request_bytes_total{redpanda_request="produce"}[10m])
          ) > 2097152
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.topic }} producing >2 MiB/s for 10m — disk-fill imminent"
          description: |
            Topic {{ $labels.topic }} is taking writes at >2 MiB/s.
            That's ~7 GiB/hour. Per-partition retention.bytes will
            tombstone, but multiple hot topics together can still
            outpace deletion. Confirm the producer is intentional and
            consider stopping the offending service.

      - alert: RedpandaConsumerLagSustained
        expr: |
          (
            redpanda_kafka_max_offset
            - on(topic, partition) group_left
              max by (topic, partition) (
                redpanda_kafka_consumer_group_committed_offset
              )
          ) > 100000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.topic }} consumer lag >100k offsets for 15m"
          description: |
            Topic {{ $labels.topic }} partition {{ $labels.partition }}
            has >100k unconsumed offsets sustained for 15m. A consumer
            is either dead or far behind. If the topic is in the order
            pipeline (orders.*, market.ticks) trading is degraded;
            otherwise check the relevant service container is healthy.

      - alert: RedpandaUnavailablePartitions
        expr: redpanda_cluster_unavailable_partitions > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Redpanda has {{ $value }} partitions without quorum
          description: |
            redpanda_cluster_unavailable_partitions is {{ $value }}.
            Producers writing to these partitions block; consumers
            can't read. Check broker health and storage. If the cluster
            is in a stuck state-machine-apply loop (like 2026-05-20),
            the only recovery is to stop+wipe the data volume.
