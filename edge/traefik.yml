api:
  dashboard: false

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# insecureSkipVerify is required because the destination is
# 127.0.0.1:18443, reached via an SSH reverse tunnel from the homelab.
# The homelab Traefik presents a self-signed cert and the SSH tunnel
# provides the actual transport security — cert verification at this
# hop would be meaningless and would require shipping the homelab's CA.
# Do not "fix" this without redesigning the tunnel.
serversTransport:
  insecureSkipVerify: true

accessLog:
  format: json

log:
  level: INFO
  format: json
