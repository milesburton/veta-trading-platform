services:
  traefik:
    image: traefik:v3.4.5
    restart: unless-stopped
    network_mode: host
    command:
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt:/letsencrypt
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  # Traefik's `errors` middleware can only proxy to a service, never
  # redirect — see dynamic.yml's offline-holding-page comment. This
  # container's sole job is to answer every request with a 302 to the
  # published status page, so the browser lands on the real docs domain
  # and its relative CSS/JS/image paths resolve correctly (they 502 if
  # the status page's HTML is proxied in-place under veta.mnetcs.com).
  status-redirect:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./status-redirect.conf:/etc/nginx/conf.d/default.conf:ro
    cap_drop:
      - ALL
    # nginx's official entrypoint starts as root, chowns its cache dirs
    # under /var/cache/nginx, then drops to the nginx user — needs CHOWN
    # (the chown itself), SETUID/SETGID (the privilege drop), and
    # DAC_OVERRIDE (writing into dirs it doesn't yet own pre-chown).
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  letsencrypt:
