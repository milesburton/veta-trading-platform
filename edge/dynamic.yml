tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: veta.mnetcs.com

http:
  routers:
    veta:
      rule: "Host(`veta.mnetcs.com`)"
      entryPoints:
        - websecure
      service: veta-origin
      tls:
        certResolver: letsencrypt
        domains:
          - main: veta.mnetcs.com
      middlewares:
        - edge-ratelimit
        - security-headers

  services:
    veta-origin:
      loadBalancer:
        servers:
          - url: "https://127.0.0.1:18443"
        passHostHeader: true

  middlewares:
    edge-ratelimit:
      rateLimit:
        average: 60
        burst: 120
        sourceCriterion:
          ipStrategy:
            # depth: 0 = trust no proxies; use the TCP peer IP directly.
            # Correct when Cloudflare is DNS-only (grey cloud). If proxy
            # is ever enabled (orange cloud), every visitor's IP collapses
            # to a small set of Cloudflare edge IPs and rate-limiting
            # becomes useless. See edge/README.md.
            depth: 0
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        # script-src 'unsafe-inline' is required by frontend/index.html which
        # has a sync <script> for theme persistence (runs before paint to
        # avoid FOUC). Tightening this requires either a build-time SHA-256
        # hash or moving the script to an external file with a CSP nonce —
        # see follow-up TODO in audit doc.
        # style-src 'unsafe-inline' is required by React inline-style props
        # used across the codebase. Tightening means refactoring to CSS
        # modules / classes.
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://veta.mnetcs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        # Fallback: customResponseHeaders adds the header unconditionally.
        # Belt-and-braces in case contentSecurityPolicy isn't honoured by
        # the running Traefik version.
        customResponseHeaders:
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://veta.mnetcs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
