# YAML anchors. Top-level `x-` keys are ignored by Traefik but let us
# define the CSP once and reference it from both places that need it
# (the contentSecurityPolicy field and the customResponseHeaders
# fallback) so they can't drift.
x-anchors:
  csp: &csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://veta.mnetcs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: letsencrypt
        domain:
          main: veta.mnetcs.com
  options:
    default:
      alpnProtocols:
        - http/1.1
        - acme-tls/1

http:
  routers:
    veta:
      rule: "Host(`veta.mnetcs.com`)"
      entryPoints:
        - websecure
      service: veta-origin
      tls:
        certResolver: letsencrypt
        domains:
          - main: veta.mnetcs.com
      middlewares:
        - edge-ratelimit
        - security-headers
        - offline-holding-page

  services:
    veta-origin:
      loadBalancer:
        servers:
          - url: "https://127.0.0.1:18443"
        passHostHeader: true
    # Fallback for the offline-holding-page errors middleware below: a
    # local nginx container (see compose.yml's status-redirect service)
    # that answers every request with a 302 to the published status
    # page. errors can only proxy to a service, not redirect directly,
    # so this indirection is what actually gets the client's browser
    # onto the real docs domain — proxying the status page's HTML
    # in-place under veta.mnetcs.com breaks its relative asset paths.
    veta-status-fallback:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8081"

  middlewares:
    edge-ratelimit:
      rateLimit:
        average: 60
        burst: 120
        sourceCriterion:
          ipStrategy:
            # depth: 0 = trust no proxies; use the TCP peer IP directly.
            # Correct when Cloudflare is DNS-only (grey cloud). If proxy
            # is ever enabled (orange cloud), every visitor's IP collapses
            # to a small set of Cloudflare edge IPs and rate-limiting
            # becomes useless. See edge/README.md.
            depth: 0
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        # script-src 'unsafe-inline' is required by frontend/index.html which
        # has a sync <script> for theme persistence (runs before paint to
        # avoid FOUC). Tightening this requires either a build-time SHA-256
        # hash or moving the script to an external file with a CSP nonce —
        # see follow-up TODO in audit doc.
        # style-src 'unsafe-inline' is required by React inline-style props
        # used across the codebase. Tightening means refactoring to CSS
        # modules / classes.
        contentSecurityPolicy: *csp
        # Fallback: customResponseHeaders adds the header unconditionally.
        # Belt-and-braces in case contentSecurityPolicy isn't honoured by
        # the running Traefik version. Both fields use the same anchor
        # defined at the top of this file so the policy can't drift.
        customResponseHeaders:
          Content-Security-Policy: *csp
    # Catches 5xx from veta-origin (tunnel down, homelab Traefik down, or
    # any backend 5xx), routes to the local status-redirect nginx (which
    # returns a 302 body + Location header), and rewrites the client-
    # facing status to match. Without statusRewrites (Traefik >=3.4 only)
    # the client would receive the ORIGINAL 5xx status with nginx's 302
    # Location header attached — browsers never act on a Location header
    # on a non-3xx response, so the redirect silently does nothing. This
    # exact failure mode shipped once already; see edge-architecture.md.
    #
    # 404 is included too: a live homelab Traefik with zero backend
    # containers registered (every app service down, only infra like
    # Postgres/Redpanda up) answers every path with its own "no matching
    # router" 404, a normal, valid HTTP response through a live tunnel,
    # not a 5xx. That reached a real browser once (2026-08-11) before
    # this was added. Safe to include broadly: this app is a SPA with no
    # public routes that should ever genuinely 404 for an end user.
    offline-holding-page:
      errors:
        status:
          - "404"
          - "500-599"
        statusRewrites:
          "404": 302
          "500-599": 302
        service: veta-status-fallback
        query: "/"
