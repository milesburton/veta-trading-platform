# Traefik v3 static configuration
# Used across all environments: local Docker, UAT, Fly.io
# TLS is activated per-router via compose.prod.yml labels (certresolver=letsencrypt)
# Fly.io: TLS termination happens at the Fly edge; internal Traefik uses :80 only

api:
  dashboard: true
  insecure: true

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    # Compose namespaces the network as `<project>_trading-net`. On the
    # homelab and UAT (compose project `veta`) the actual network is
    # `veta_trading-net`. Other stacks on the homelab (LGTM observability,
    # the personal caddy/mediawiki bridge) also attach to this exact name,
    # so we match the de-facto identifier rather than rename it.
    network: veta_trading-net

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
    buckets:
      - 0.01
      - 0.05
      - 0.1
      - 0.25
      - 0.5
      - 1.0
      - 2.0

accessLog:
  format: json

log:
  level: INFO
  format: json
